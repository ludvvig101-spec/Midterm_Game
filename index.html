etween tasks when moving from a contaminated site to a clean site. Gloves do NOT replace hand hygiene"}, {"t": "b", "x": "Transmission-Based Precautions: Contact: gown/gloves when indicated | Droplet: surgical/procedure mask | Airborne: AIIR/Negative pressure/N95/higher | Protective Environment: positive pressure/HEPA/sealed room"}, {"t": "b", "x": "Negative pressure protects others from infectious patients | Positive pressure protects immunocompromised patients"}, {"t": "b", "x": "Chain of Infection: 3 elements of transmission of infection. Break any link to help prevent transmission."}, {"t": "b", "x": "Source/reservoir, Susceptible host, Route of transmission"}, {"t": "b", "x": "RT reservoirs/formites: secretions, nebulizers, reservoirs, ventilator surfaces, and shared equipments"}, {"t": "b", "x": "Cleaning/Disinfection/Sterilization: Clean first then process based on risk -Cleaning: removes soil/debris | Disinfection: destroys many/all pathogens not spores | Sterilization: destroys all microbial life"}, {"t": "b", "x": "Spaulding Classification: Think- “What did it touch” ￼"}, {"t": "b", "x": "Critical - Sterile tissue - Sterilize | Semicritical - Mucous membrane - High level disinfection | Noncritical - Intact skin - clean & low/intermediate-level disinfection as indicated"}, {"t": "b", "x": "Respiratory Equipment Infection Control:"}, {"t": "b", "x": "Do:Drain away from patient | Sterile technique for open suction | properly reprocess reusable BVMs/bronchoscopes"}, {"t": "b", "x": "Don’t: Top off nebulizer/humidifier reservoirs | routinely change clean/functioning ventilator circuits | drain condensate towards patient"}, {"t": "b", "x": "VAE Prevention: HOB 30-45 degrees when appropriate | oral care | minimize sedation | assess liberation readiness | early mobility | avoid unnecessary circuit changes | manage condensate safely"}, {"t": "p", "x": "VAE prevention = bedside care | VAE surveillance ≠ diagnosis of pneumonia"}, {"t": "h", "x": "8. Fluids, medications, sharps, and specimen"}, {"t": "p", "x": "When handling fluids, medications, sharps, and specimens, always use proper PPE and follow infection-control procedures. Treat body fluids and specimens as potentially infectious, properly contain and disinfect spills, and never reuse contaminated disposable equipment. Medications should be checked for the right patient, medication, dose, route, time, expiration date, and proper labeling before administration. Sharps should never be recapped, bent, or placed in regular trash; they should be immediately placed in an approved sharps container. Specimens should be collected correctly, placed in the proper container, labeled accurately, and transported in the appropriate biohazard bag."}], "6": [{"t": "b", "x": "Critical temperature"}, {"t": "b", "x": "The critical temperature of a gas is the temp at which a gas can no longer be turned back into a liquid with pressure alone"}, {"t": "b", "x": "The temp of the gas must first be lower"}, {"t": "b", "x": "Critical temp is the highest temp at which a substance can remain a liquid"}, {"t": "b", "x": "Critical pressure"}, {"t": "b", "x": "The pressure needed to liquify a gas at its critical temp."}, {"t": "b", "x": "Laminar flow"}, {"t": "b", "x": "This flow is when a liquid moves in a smooth manner"}, {"t": "b", "x": "The liquid particles move in a parallel even way"}, {"t": "b", "x": "Occurs a lower flow rates with no changes in direction"}, {"t": "b", "x": "Transitional flow"}, {"t": "b", "x": "Occurs between laminar and turbulent flow"}, {"t": "b", "x": "Creates more resistance than laminar flow but less than turbulent flow"}, {"t": "h", "x": "Need to know for Liquid Properties"}, {"t": "b", "x": "Liquid Properties:"}, {"t": "b", "x": "Fixed volume and change shape"}, {"t": "b", "x": "Can be compressed"}, {"t": "b", "x": "Exert cohesive forces"}, {"t": "b", "x": "Pressure"}, {"t": "b", "x": "Dependent of liquids height (depth) and weight density"}, {"t": "p", "x": "Pascal’s Principle: liquid pressure depends on height not on the container’s shape the pressure on the liquid is equal in all directions"}, {"t": "b", "x": "Bouyancy"}, {"t": "b", "x": "Liquid pressure within a container producing an upward force"}, {"t": "b", "x": "Liquids exert buoyant forces because the pressure below the submerged object exceeds the pressure from above"}, {"t": "p", "x": "Archimedes Principle: discovered a submerged object in water weigh less than it did in air"}, {"t": "b", "x": "The buoyant force must equal the weight of the fluid displaced by the object"}, {"t": "h", "x": "How does Archimedes Principle relate to respiratory?"}, {"t": "b", "x": "Buoyant forces help keep solid particles suspended in gases"}, {"t": "b", "x": "Example Aerosols, they are liquid droplets or solid particles suspended in a gas"}, {"t": "b", "x": "Changing the density of gas the buoyancy also changes which affects the ability to suspend the aerosol because of a change in weight volume of the gas and the volume displaced change"}, {"t": "b", "x": "Viscosity"}, {"t": "b", "x": "Resistance to flow caused by internal friction"}, {"t": "b", "x": "Directly proportional to cohesive forces between molecules"}, {"t": "p", "x": "Think about it this way: High Viscosity ➡️ Increase Resistance to Flow and Low Viscosity ➡️ Decrease Resistance to Flow"}, {"t": "p", "x": "Example: Blood The higher the viscosity in the blood the more energy required to help blood flow. Cause the heart to work harder to pump blood. Condition is polycythemia"}, {"t": "h", "x": "Example: Thick Mucus Secretions (Cystic Fibrosis or Severe Bronchitis)"}, {"t": "h", "x": "Factor Affecting the Viscosity"}, {"t": "b", "x": "Dehydration"}, {"t": "b", "x": "Infections"}, {"t": "p", "x": "How? Mucus viscosity increases causing them to become thick, increasing flow resistance."}, {"t": "b", "x": "Cohesion and Adhesion"}, {"t": "p", "x": "Cohesion: attractive forces between like molecules"}, {"t": "b", "x": "Forces within water"}, {"t": "p", "x": "Adhesion: attractive forces between unlike molecules"}, {"t": "b", "x": "Water and glass"}, {"t": "b", "x": "Surface Tension"}, {"t": "b", "x": "Strong cohesive forces within the water molecules"}, {"t": "b", "x": "Surface tension varies inversely with temperature"}, {"t": "b", "x": "Increase of temperature and radius decreases surface tension and pressure"}, {"t": "b", "x": "Decrease of temperature and radius increases surface tension and pressure"}, {"t": "p", "x": "Think like this: A larger radius has better flow decreasing the pressure. A smaller radius decrease flow increasing pressure"}, {"t": "h", "x": "Laplace Law:"}, {"t": "b", "x": "Describes the relationship between internal pressure, surface tension, and the radius of the alveoli"}, {"t": "p", "x": "Equation: P=2T/R defines the relationship between surface tension and the radius of a sphere"}, {"t": "p", "x": "P=4T/R represents twice the surface tension"}, {"t": "h", "x": "Example:"}, {"t": "p", "x": "A mucus plug is blocking the airway, there is an inadequate flow of air going to the alveoli. This will cause an increase in air flow resistance causing an increase in the work of breathing. The mucus plug will cause the alveoli to be underinflated because of inadequate air flow."}, {"t": "b", "x": "Mucus plug constricts the air way blocking air flow"}, {"t": "b", "x": "Decrease in radius + increase pressure = increase surface tension"}, {"t": "b", "x": "Cause alveoli to collapse pushing air out"}, {"t": "h", "x": "Potential Issues:"}, {"t": "b", "x": "This patient will hypoventilate affecting gas exchange and become hypoxic, and won’t be able to blow off CO2 increasing PaCO2 levels."}, {"t": "b", "x": "CO2 retention ➡️ low pH level ➡️ experiencing respiratory acidosis. ."}, {"t": "h", "x": "Surfactant:"}, {"t": "b", "x": "Disrupts the strong cohesive forces of water"}, {"t": "b", "x": "Prevents the alveoli from collapsing"}, {"t": "h", "x": "Neonatal issues"}, {"t": "b", "x": "Premature babies don’t develop surfactant"}, {"t": "b", "x": "Leads to collapsed alveoli/ atelectasis"}, {"t": "b", "x": "Increase the work of breathing for the baby"}, {"t": "h", "x": "Interventions"}, {"t": "b", "x": "Surfactant is administered to the premature baby"}, {"t": "b", "x": "Helps reducing surface tension and allow expansion of the alveoli"}, {"t": "b", "x": "It’ll decrease the work of breathing and enhance air flow"}, {"t": "b", "x": "Capillary Action"}, {"t": "b", "x": "Adhesion and surface tension can move liquid through a narrow path way"}, {"t": "b", "x": "Movement of a liquid upward in a small tube against gravity involving adhesion and surface tension. Liquids rise higher in tubes with a smaller cross-section"}, {"t": "p", "x": "Example: Wick humidifiers"}, {"t": "h", "x": "How does it relate?"}, {"t": "b", "x": "Wick humidifiers use capillary action by drawing water from the reservoir and keeps the wick’s absorbent material saturated. Allows for dry gas to enter the chamber allowing it to pick up heat and moisture and leaving it saturated with water vapor."}, {"t": "h", "x": "Need to Know/Review"}, {"t": "h", "x": "Temperature conversions:"}, {"t": "p", "x": "°C = (°F - 32) × 5/9."}, {"t": "p", "x": "°F = (°C × 9/5) + 32."}, {"t": "p", "x": "K = °C + 273. Write K without a degree symbol."}, {"t": "b", "x": "Kelvin starts at absolute zero and is used for gas-law temperature ratios, but is not a value for bedside vital signs"}, {"t": "b", "x": "Temperature is a measurement of heat, which results from the collision of molecules. In gases, temperature is directly proportional to kinetic energy, representing the energy of motion. For solids and liquids, it's only a part of their total internal energy."}, {"t": "h", "x": "Four states of matter and their key characteristics"}, {"t": "p", "x": "The four states of matter are solids, liquids, gases, and plasma."}, {"t": "b", "x": "Solids have a fixed volume and shape. Their molecules are closely packed with strong attractive forces, leading to a high degree of internal order and limited back-and-forth motion (a \"jiggle\")."}, {"t": "b", "x": "Liquids have a fixed volume but adapt to the shape of their container. While their molecules exhibit mutual attraction, these forces are weaker than in solids, allowing molecules to move freely. Liquids are dense and not easily compressed."}, {"t": "b", "x": "Gases have no fixed volume or shape, easily compressing and expanding to fill their available space. Gas molecules have very weak attractive forces, exhibiting rapid, random motion with frequent collisions. Both liquids and gases are considered fluids."}, {"t": "b", "x": "Plasma is a combination of neutral atoms, free electrons, and atomic nuclei. It can react to electromagnetic forces and flow freely like a liquid or a gas. While a fourth state of matter, it is not currently considered relevant to respiratory care."}, {"t": "p", "x": "Kinetic energy is molecular motion, especially prominent in gases. Potential energy includes the effects of molecular position and attraction. Adding energy can speed molecules or change their arrangement"}, {"t": "h", "x": "Four mechanisms of heat transfer"}, {"t": "p", "x": "Heat transfer occurs when objects at different temperatures exchange thermal energy until they reach equilibrium. The four ways heat can be transferred are:"}, {"t": "b", "x": "Conduction: The main method of heat transfer in solids, involving the direct contact and transfer of energy between hot and cold molecules."}, {"t": "b", "x": "Convection: The primary method in liquids and gases, involving the mixing of fluid molecules at different temperatures. Warmed fluid circulates to carry heat elsewhere, forming convection currents."}, {"t": "b", "x": "Radiation: Heat transfer that occurs without direct physical contact between substances, even in a vacuum, such as the sun warming the earth."}, {"t": "b", "x": "Evaporation and Condensation: Evaporation (vaporization) is the change from liquid to gas, which requires and takes heat from the surroundings, causing cooling. Condensation is the opposite, where gases become liquids and release heat back into the surroundings, causing warming."}, {"t": "h", "x": "Heat transfers from highest to lowest state of order"}, {"t": "h", "x": "Quick reference sheet:"}, {"t": "h", "x": "The Coanda Effect"}, {"t": "p", "x": "Fluidics and the Coanda Effect: Fluidics applies hydrodynamic principles for flow circuits. The Coanda effect (wall attachment) occurs when a fluid jet flows along a curved surface, and the pressure near the wall becomes negative, \"locking\" the fluid stream to the wall. This principle is used in fluidic devices without moving parts."}, {"t": "b", "x": "NBRC clinical trigger: MRI-safe fluidic ventilator circuits"}, {"t": "h", "x": "Review/Need To Know"}, {"t": "p", "x": "Water-vapor correction: calculation used to find an accurate measurement of a gas with the removal of the weight of water"}, {"t": "p", "x": "Pgas = Fgas x (PB - 47)"}, {"t": "p", "x": "Variables:"}, {"t": "b", "x": "Pgas = corrected gas pressure"}, {"t": "b", "x": "Fgas = fractional concentration of the gas in gas mixture"}, {"t": "b", "x": "PB = barometric pressure (760 mmHg at sea level)"}, {"t": "b", "x": "47 mmHg = water vapor pressure (PH2O) at given temperature (37 deg C)"}, {"t": "h", "x": "Water vapor occupies part of the total pressure, leaving less pressure available to the dry respiratory gases"}, {"t": "h", "x": "Effects of Water Vapor"}, {"t": "b", "x": "Water pressure is independent of the other gases that it mixes with therefore it depends only on temperature and RH"}, {"t": "b", "x": "The addition of water vapor to a gas mixture always lowers the partial pressures of the other gases which is important when it comes to partial pressure of gases inside the lungs"}, {"t": "b", "x": "Without this water-vapor correction, the value of inspired gas partial pressure would be overestimated and inaccurate"}, {"t": "p", "x": "Alveolar air equation: used to calculate the partial pressure of oxygen inside the alveoli"}, {"t": "p", "x": "PAO2 = FiO2(PB - 47) - PaCO2/0.8"}, {"t": "h", "x": "Variables:"}, {"t": "b", "x": "PB = barometric pressure (typically 760 mmHg at sea level)"}, {"t": "b", "x": "PH2O = partial pressure of water vapor in the lungs (typically 47 mmHg)"}, {"t": "b", "x": "FiO2 = Fraction of inspired oxygen gas (room air is 0.21 or 21%)"}, {"t": "b", "x": "PaCO2 = arterial partial pressure of carbon dioxide (normally 40mmHg)"}, {"t": "b", "x": "RQ = respiratory quotient - the ratio of CO2 produced to O2 consumed (usually about 0.8)"}, {"t": "h", "x": "Clinical Use:"}, {"t": "p", "x": "A-a Gradient: used to find the alveolar-arterial oxygen gradient (PAO2 - PaO2) which helps diagnose the cause of hypoxia (such as a shunt or V/Q mismatch)"}, {"t": "h", "x": "Humidity"}, {"t": "b", "x": "Absolute Humidity (AH): is the ACTUAL AMOUNT of water vapor in gas. Its unit is mg/L."}, {"t": "b", "x": "Relative Humidity (RH): is HOW FULL the gas is compared with its water vapor capacity at that temperature."}, {"t": "b", "x": "Calculate RH: RH= AH ÷ saturated capacity × 100."}, {"t": "b", "x": "EX: 12 mg/L ÷ 20mg/L ×100 = 60% RH"}, {"t": "p", "x": "Cooling, Dew Point, Rainout"}, {"t": "b", "x": "When gas cools, its capacity to hold water vapor decreases."}, {"t": "b", "x": "If no water has condensed yet, AH stays the same while RH rises."}, {"t": "b", "x": "At the dew point, RH reaches 100%. Further cooling causes water vapor to condense into droplets."}, {"t": "b", "x": "Rainout is condensation collecting in breathing circuit tubing."}, {"t": "b", "x": "Seeing rainout does not prove the patient is receiving adequate humidity at the airway."}, {"t": "b", "x": "If water collects near the patient, the RT should keep it from reaching the airway, manage it according to facility procedure, and check why the circuit is cooling."}, {"t": "h", "x": "FACTORS AFFECTING DIFFUSION"}, {"t": "p", "x": "Diffusion: Is the movement of gas from an area of higher partial pressure to lower partial pressure. Oxygen diffuses from the alveoli into the blood."}, {"t": "b", "x": "Pressure Difference: A bigger difference moves gas faster."}, {"t": "b", "x": "Membrane Thickness: A thicker barrier slows gas movement."}, {"t": "b", "x": "Surface Area: More area allows more gas exchange."}, {"t": "b", "x": "Gas properties: Lighter gases generally diffuse faster than heavier gases when other conditions are equal (Graham's Law)."}, {"t": "b", "x": "Why it's important: These factors help an RT understand why a patient may have low blood oxygen, even when they are breathing oxygen. For example, fluid in the lungs can make the barrier thicker, slowing oxygen transfer."}, {"t": "h", "x": "Partial pressure and gas solubility"}, {"t": "p", "x": "Partial pressure: Pressure exerted by a single gas in a mixture"}, {"t": "p", "x": "Dalton’s Law: The total atmosphere pressure is the sum of the particle pressure of individual gases. (The entire atmosphere around us has a particular pressure associated with it)"}, {"t": "b", "x": "Dalton = Different gases add together. (O2+N2+CO2)"}, {"t": "b", "x": "Think: Total pressure is the sum of all individual gas pressures."}, {"t": "b", "x": "Altitude changes pressure, not fraction"}, {"t": "b", "x": "Oxygen fraction is not oxygen pressure"}, {"t": "b", "x": "A gas keeps its fractional concentration while partial pressure changes with total pressure"}, {"t": "b", "x": "FiO2 is a fraction/concentration"}, {"t": "b", "x": "PO2 is a pressure"}, {"t": "b", "x": "Don’t use terms interchangeably"}, {"t": "b", "x": "Principle states partial pressure of a component gas must be proportional to its percentage in its mixture"}, {"t": "b", "x": "Expressed in decimal form (fractional concentration)"}, {"t": "p", "x": "Example: O2 = 21% is .21 , N=79% is .79"}, {"t": "h", "x": "Equation:"}, {"t": "p", "x": "Pgas = Fgas X Ptotal (Partial pressure = Fractional concentration x Total pressure)"}, {"t": "p", "x": "PO2 = FiO2 x PB"}, {"t": "p", "x": "PO2 = partial pressure of oxygen"}, {"t": "p", "x": "FiO2 = fraction of inspired oxygen"}, {"t": "p", "x": "PB = barometric pressure"}, {"t": "p", "x": "Location · FiO₂ · Total pressure · PO₂"}, {"t": "p", "x": "Sea level · 21% · 760 mmHg · 160 mmHg"}, {"t": "p", "x": "High altitude · 21% · 500 mmHg · 105 mmHg"}, {"t": "b", "x": "Same % O₂ + ↓ atmospheric pressure = ↓ PO₂"}, {"t": "b", "x": "Think of it as: the percentage doesn't change, but the oxygen has less pressure pushing it into your lungs."}, {"t": "b", "x": "This is why people can become hypoxemic at high altitude even though the air is still 21% oxygen."}, {"t": "b", "x": "So even though you're still breathing air that is 21% oxygen, each breath has a lower partial pressure of oxygen because the total atmospheric pressure is lower."}, {"t": "p", "x": "Henry's Law: The amount of dissolved gas in a liquid is proportional to its partial pressure above liquid, at a constant temperature"}, {"t": "p", "x": "Key concept: Increasing gas pressure increases the amount of that gas dissolved in liquid."}, {"t": "p", "x": "Higher pressure = more gas dissolves"}, {"t": "p", "x": "Lower pressure = less gas dissolves"}, {"t": "b", "x": "In the lungs, oxygen moves from the alveoli into the blood. Henry’s law describes the relationship between oxygen partial pressure and the amount of oxygen physically dissolved in blood."}, {"t": "b", "x": "Partial pressure gradient"}, {"t": "b", "x": "Gases will always move from high to low"}, {"t": "b", "x": "Temperature changes solubility, so patient temperature can change how gas behaves in blood"}, {"t": "b", "x": "Cooling increases gas solubility; warming decreases gas solubility"}, {"t": "b", "x": "RT application: gas dissolved in blood, ABG temperature context, diffusion foundation"}, {"t": "p", "x": "Henry = High pressure helps gas dissolve."}, {"t": "p", "x": "Think: More pressure means more gas dissolves in liquid."}, {"t": "h", "x": "Must-Know Concepts — About 5 Minutes"}, {"t": "p", "x": "Boyle’s law. It states that temperature remains constant. Pressure is multiplied by volume to get temperature in Kelvin (P V = K). As a result, the volume of a gas varies inversely with its pressure. Formula to remember: P1V1 = P2V2"}, {"t": "p", "x": "Charles’s Law. It states that pressure doesn’t change. Volume is divided by Temperature to get Temperature( V/T = K ). And the volume of a gas varies directly with changes in its temperature (K). Formula to remember: V1/T1 = V2/T2."}, {"t": "p", "x": "Gay-Lussac’s Law. It states that volume remains constant. Pressure divided by Temperature gives you temperature in Kelvin. Pressure is directly related to absolute temperature."}, {"t": "p", "x": "Formula: P1/T1 = P2/T2."}, {"t": "p", "x": "Combined Gas Law. Temperature, Volume, and Pressure change. None of these stay constant. Formula to Remember: P1V1/nT1 = P2V2/nT2"}, {"t": "p", "x": "Note: n is the amount of mass of a gas."}, {"t": "p", "x": "Source(s): Section 1, Foundations of Respiratory Care, Physical Principles of Respiratory Care, Chapter 6, pg. 101,102; Chapter 41. Eagan’s Fundamentals of Respiratory Care."}], "39": [{"t": "h", "x": "Must know sheet"}, {"t": "h", "x": "1. Key Concepts & Important Values"}, {"t": "b", "x": "4 factors that affect humidification:"}, {"t": "b", "x": "Temperature: Most important factor. Warmer gas can hold more water vapor."}, {"t": "b", "x": "Surface area: More contact between gas and water = more humidity."}, {"t": "b", "x": "Contact time: Longer contact with water = more humidity."}, {"t": "b", "x": "Thermal mass: More water/heat storage = more stable humidity output."}, {"t": "b", "x": "Evaporative cooling: When water evaporates, it takes heat with it, lowering the water temperature."}, {"t": "b", "x": "Capillary action: A wick absorbs and pulls water upward, keeping its surface wet."}, {"t": "h", "x": "2. Must-Know Numbers & Equipment"}, {"t": "b", "x": "37°C = 44 mg/L"}, {"t": "b", "x": "Humidity deficit = 44 − delivered humidity (Formula need to know)"}, {"t": "b", "x": "Wick: Increases surface area."}, {"t": "b", "x": "Bubble: Smaller bubbles → greater surface area → more humidification."}, {"t": "b", "x": "Gas travels through water as bubbles."}, {"t": "b", "x": "Common problem: leak around the cap/pop-off valve/tubing."}, {"t": "b", "x": "If no bubbling, check the gas source, flow, connections, leaks, and obstructions."}, {"t": "b", "x": "Heated reservoir: Maintains stable humidity, especially with high flows."}, {"t": "b", "x": "Adds heat to increase water-vapor capacity."}, {"t": "b", "x": "Monitor water level, temperature, circuit, and sensor position."}, {"t": "b", "x": "HME"}, {"t": "b", "x": "Captures exhaled heat and moisture and returns it during inspiration."}, {"t": "b", "x": "Adds mechanical dead space and may increase resistance."}, {"t": "b", "x": "Replace/remove if loaded with secretions or moisture, or if resistance increases."}, {"t": "b", "x": "Poor choice with copious/thick secretions or very low VT."}, {"t": "b", "x": "BLAND AEROSOL / NEBULIZER"}, {"t": "h", "x": "Jet Nebulizer"}, {"t": "b", "x": "Uses compressed gas."}, {"t": "b", "x": "Bernoulli principle creates a low-pressure region that draws liquid up."}, {"t": "b", "x": "Baffles remove larger particles."}, {"t": "p", "x": "Ultrasonic Nebulizer (USN)"}, {"t": "b", "x": "Uses a piezoelectric crystal."}, {"t": "b", "x": "Frequency → particle size"}, {"t": "b", "x": "Amplitude → aerosol output/amount"}, {"t": "b", "x": "Carrier flow → moves aerosol to the patient"}, {"t": "b", "x": "Weak/no mist: check power, gas/carrier flow, water/couplant, solution level, tubing, settings, and transducer."}, {"t": "h", "x": "3. Humidity Basics Must Know"}, {"t": "b", "x": "Humidification = adding water vapor to inspired gas."}, {"t": "b", "x": "Bland aerosol = suspended liquid particles, not water vapor."}, {"t": "b", "x": "The upper airway normally warms and humidifies inspired gas."}, {"t": "b", "x": "?><z.spired gas."}, {"t": "b", "x": "An artificial airway bypasses the upper airway, increasing the need for humidification"}, {"t": "b", "x": "Absolute humidity: actual amount of water vapor in a gas, measured in milligrams per liter (mg/L)"}, {"t": "b", "x": "Relative humidity: percent of saturation at the current temperature"}, {"t": "b", "x": "Body temperature and pressure saturated (BTPS): 37c, 100% RH, 44 mg/L AH"}, {"t": "b", "x": "Humidity Deficit: amount of water the airway must still supply. Formula: 44 mg/L - delivered AH"}, {"t": "h", "x": "4. Important Terminology and values"}, {"t": "b", "x": "BTPS = Body, Temperature, ambient Pressure, Saturated with water vapor"}, {"t": "b", "x": "At 37 C, fully saturated gas contains about 44 mg H2O/L"}, {"t": "b", "x": "Absolute Humidity (AH) = actual amount of water vapor in gas, expressed in mg/L"}, {"t": "b", "x": "Relative Humidity Deficit = the difference between the amount of moisture currently in the air and the maxium amount it can hold at saturation for a given temperature."}, {"t": "b", "x": "IBS (Isothermic Saturation Boundary) = point where inspired gas reaches 37 °C and 100% RH"}, {"t": "b", "x": "Inadequate humidification causes the ISB to shift deeper into the lung"}, {"t": "h", "x": "5. Rainout/Condensation"}, {"t": "b", "x": "Occurs when warm humidified gas cools and can no longer hold the same amount of water vapor."}, {"t": "b", "x": "Risks: airway flooding, increased resistance, contamination, bacterial growth."}, {"t": "b", "x": "Drain condensates away from the patient using proper infection-control technique."}, {"t": "b", "x": "Never allow circuit water to drain back toward the patient."}, {"t": "h", "x": "6. Servo control safety"}, {"t": "b", "x": "Position the temperature probe where the manufacturer intended, typically near the patient airway."}, {"t": "b", "x": "Incorrect probe position → humidifier regulates according to the wrong temperature → overheating or inadequate humidification."}, {"t": "h", "x": "7. Troubleshoot"}, {"t": "b", "x": "Patient first — airway, WOB, RR, SpO₂, distress."}, {"t": "b", "x": "Interface/circuit — kink, leak, blockage, disconnection."}, {"t": "b", "x": "Power or driving gas."}, {"t": "b", "x": "Device settings."}, {"t": "b", "x": "Water/solution / couplant level."}, {"t": "b", "x": "Temperature sensor/probe position."}, {"t": "b", "x": "Confirm output is actually reaching the patient."}, {"t": "b", "x": "Reassess the patient after correction."}, {"t": "h", "x": "8. Common mistake"}, {"t": "b", "x": "Confusing humidification (vapor) with aerosol (liquid particles)."}, {"t": "b", "x": "Saying AH and RH are the same."}, {"t": "b", "x": "Forgetting that cooler gas holds less water vapor → rainout."}, {"t": "b", "x": "Replacing equipment before troubleshooting the system."}, {"t": "b", "x": "Forgetting HME adds dead space/resistance."}, {"t": "b", "x": "Forgetting: USN frequency = particle size; amplitude = output."}]};

function home(){const{r,n}=rank(),pc=n?Math.min(100,(S.xp-r[0])/(n[0]-r[0])*100):100,due=ids().filter(i=>S.miss[i]&&(S.box[i]||0)<3).length;
app.innerHTML=`<h1>🚑 CODE BLUE</h1><p class="sub">Midterm Mission · Egan's Ch. 4, 6 &amp; 39 · all ${Q.length} study-guide questions</p>${ecgBox}
<div class="card"><div class="row sp"><b>${r[1]}</b><span class="chip">${S.xp} XP${n?" · next: "+n[1]:" · max rank"}</span></div><div class="bar" style="margin-top:8px"><i style="width:${pc}%"></i></div>
<p class="sub" style="margin:8px 0 0">Overall mastery: <b>${mastery()}%</b> (a question is mastered after you answer it right 3 times in a row)</p></div>
<h2>Missions</h2><div class="grid g3">${Object.keys(CH).map(c=>`<button class="ch card" onclick="chapter(${c})"><b>${CH[c][2]} Ch. ${c}: ${CH[c][0]}</b><small>${CH[c][1]}</small><div class="bar" style="margin:8px 0 4px"><i style="width:${mastery(c)}%"></i></div><small>${mastery(c)}% mastered · <span class="stars">${"★".repeat(S.stars[c]||0)}${"☆".repeat(3-(S.stars[c]||0))}</span></small></button>`).join("")}</div>
<h2>Challenges</h2><div class="grid g3">
<button class="card ch" onclick="boss()"><b>👑 Boss Exam</b><small>15 mixed questions · 45 s each · 3 lives. Interleaving builds exam-day skill.</small></button>
<button class="card ch" onclick="clinic()"><b>🛠️ Mistake Clinic</b><small>${due} question${due==1?"":"s"} waiting. Retry what you missed.</small></button>
<button class="card ch" onclick="brief(4)"><b>📋 Briefing Room</b><small>Review notes from your group's pages.</small></button></div>
<div class="row" style="margin-top:14px"><button onclick="S.snd=!S.snd;save();home()">${S.snd?"🔊 Sound on":"🔇 Sound off"}</button><button onclick="if(confirm('Erase all progress?')){localStorage.removeItem('codeblue1');S={xp:0,box:{},miss:{},stars:{},bad:{},snd:true,best:0};home()}">Reset progress</button></div>
<p class="sub">Badges: ${Object.keys(BADGES).map(k=>S.bad[k]?BADGES[k]:"🔒").join(" ")}</p>`;startEcg()}
function chapter(c){app.innerHTML=`<button onclick="home()">← Back</button><h2>${CH[c][2]} Ch. ${c}: ${CH[c][0]}</h2><p class="sub">Tip: skim the briefing first, then test yourself. Recalling answers beats re-reading.</p><div class="grid"><button class="pri" onclick="run('Ch. ${c} Mission',pick(ids(${c}),10),{c:${c}})">▶ Start Mission (10 questions)</button><button onclick="brief(${c})">📋 Read briefing first</button></div>`}
function brief(c){const t=Object.keys(CH).map(k=>`<button ${k==c?'class="pri"':""} onclick="brief(${k})">Ch. ${k}</button>`).join("");
app.innerHTML=`<button onclick="home()">← Back</button><h2>📋 Briefing Room</h2><div class="row">${t}</div><div class="card note">${NOTES[c].map(n=>n.t=="h"?`<h3>${esc(n.x)}</h3>`:n.t=="b"?`<li>${esc(n.x)}</li>`:`<p>${esc(n.x)}</p>`).join("").replace(/(<li>.*?<\/li>)+/gs,m=>`<ul>${m}</ul>`)}</div><button class="pri" onclick="run('Ch. ${c} Mission',pick(ids(${c}),10),{c:${c}})">▶ Start Mission</button>`;scrollTo(0,0)}
function boss(){run("Boss Exam",pick(shuf(ids()).slice(0,45),15),{boss:1,timed:45})}
function clinic(){const p=ids().filter(i=>S.miss[i]&&(S.box[i]||0)<3);if(!p.length){app.innerHTML=`<button onclick="home()">← Back</button><div class="card"><p class="big">✅</p><p style="text-align:center">The clinic is empty! Miss a few questions in missions and they will queue here.</p></div>`;return}run("Mistake Clinic",pick(p,10),{clinic:1})}
// run
let R,tm;
function run(title,list,o){R={title,o,q:list.slice(),total:list.length,lives:3,score:0,streak:0,top:0,ok:0,first:{},seen:0};next();}
function next(){clearInterval(tm);if(!R.q.length||R.lives<=0)return end();const i=R.q.shift();R.cur=i;R.t=Q[i];R.pickd=false;const q=R.t;
const ord=/none of the above|all of the above/i.test(q.o.join(" "))?[0,1,2,3]:shuf([0,1,2,3]);R.ord=ord;
app.innerHTML=`<div class="hud"><span class="hearts" aria-label="${R.lives} lives">${"❤️".repeat(R.lives)}${"🖤".repeat(3-R.lives)}</span><span>⚡ ${R.score}</span><span>🔥 x${R.streak}</span><span class="chip">${R.title}</span></div>
<div class="bar" style="margin:8px 0"><i style="width:${Math.max(0,Math.min(100,100*(R.total-R.q.length-1)/R.total))}%"></i></div>${ecgBox}
<div class="card pop" id="qc"><div class="row sp"><span class="chip">Ch. ${q.c} · ${q.l}${R.first[i]===false?" · retry":""}</span><span class="chip" id="clk"></span></div><div class="q">${esc(q.q)}</div>
${ord.map((k,n)=>`<button class="opt" onclick="ans(${n})"><kbd>${"ABCD"[n]}</kbd><span>${esc(q.o[k])}</span></button>`).join("")}<div id="fb" aria-live="polite"></div></div>`;
startEcg();if(R.o.timed){let t=R.o.timed;const c=$("#clk");c.textContent="⏱ "+t;tm=setInterval(()=>{t--;c.textContent="⏱ "+t;if(t<=0){clearInterval(tm);ans(-1)}},1000)}}
function ans(n){if(R.pickd)return;R.pickd=true;clearInterval(tm);const q=R.t,i=R.cur,ci=R.ord.indexOf(q.a),ok=n==ci,B=document.querySelectorAll(".opt");
B.forEach((b,k)=>{b.disabled=true;if(k==ci)b.classList.add("ok");else if(k==n)b.classList.add("bad")});
const firstTry=R.first[i]===undefined;if(firstTry)R.first[i]=ok;
if(ok){R.streak++;R.top=Math.max(R.top,R.streak);const pts=100+Math.min(R.streak,10)*10;R.score+=pts;const xp=firstTry?10+Math.min(R.streak,5):4;S.xp+=xp;if(firstTry)R.ok++;S.box[i]=Math.min(4,(S.box[i]||0)+1);good();badge("first");if(R.streak>=5)badge("s5")}
else{R.streak=0;R.lives--;S.box[i]=0;S.miss[i]=(S.miss[i]||0)+1;wrong();$("#qc").classList.add("shake");if(R.q.indexOf(i)<0)R.q.splice(Math.min(R.q.length,3),0,i)}
save();
$("#fb").innerHTML=`<div class="fb ${ok?"":"bad"} pop"><b>${ok?"✅ Stable! +"+(100+Math.min(R.streak,10)*10)+" pts":n<0?"⏱ Time's up.":"❌ Not quite."}</b> ${ok?"":"The answer is <b>"+"ABCD"[ci]+"</b>. This question will come back soon."}<br>${esc(q.e)}${q.s?`<small>📖 ${esc(q.s)}</small>`:""}</div><button class="pri" style="margin-top:10px;width:100%" id="nx" onclick="next()">${R.lives<=0?"See results":R.q.length?"Next ▶":"Finish ▶"}</button>`;$("#nx").focus();if(R.lives<=0){flat=true}}
function end(){const all=R.total,acc=Math.round(100*R.ok/all),dead=R.lives<=0,st=dead?0:acc>=90?3:acc>=70?2:1;let msg="";
if(!dead){if(R.o.c){S.stars[R.o.c]=Math.max(S.stars[R.o.c]||0,st)}if(acc==100){badge("perfect");S.xp+=50}if(R.o.boss){badge("boss");S.xp+=100}if(R.o.clinic)badge("clinic")}
S.best=Math.max(S.best,R.score);save();
app.innerHTML=`${ecgBox}<div class="card pop"><p class="big">${dead?"💔":"🏆"}</p><h2 style="text-align:center">${dead?"Patient crashed — Code Blue!":"Mission complete!"}</h2>
<p style="text-align:center" class="stars">${dead?"":"★".repeat(st)+"☆".repeat(3-st)}</p>
<p style="text-align:center">First-try accuracy <b>${acc}%</b> · Score <b>${R.score}</b> · Best streak <b>${R.top}</b></p>
<p class="sub" style="text-align:center">${dead?"No worries, every miss is now queued in the Mistake Clinic. Retrieval practice works best when it's a little hard.":"Missed questions are scheduled to return. Come back tomorrow: spacing beats cramming."}</p></div>
<div class="grid"><button class="pri" onclick="${R.o.c?`run('Ch. ${R.o.c} Mission',pick(ids(${R.o.c}),10),{c:${R.o.c}})`:R.o.boss?"boss()":"clinic()"}">🔁 Go again</button><button onclick="home()">🏠 Home</button></div>`;startEcg();if(dead)setTimeout(()=>flat=true,50)}
document.addEventListener("keydown",e=>{if(!R||!$(".opt"))return;const k="abcd1234".indexOf(e.key.toLowerCase());if(k>=0&&!R.pickd)ans(k%4);else if((e.key=="Enter"||e.key==" ")&&R.pickd&&$("#nx")&&document.activeElement!=$("#nx")){e.preventDefault();next()}});
home();
</script></body></html>
