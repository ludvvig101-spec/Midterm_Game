<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CODE BLUE: Midterm Mission</title>
<meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--card:#131c30;--line:#24324f;--tx:#e8eefc;--mut:#8fa0c4;--ok:#2ee59d;--bad:#ff5470;--acc:#35d0ff;--gold:#ffc83d}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16264a,var(--bg));color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
#app{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:30px;margin:6px 0;letter-spacing:.5px}h2{margin:18px 0 8px;font-size:20px}h3{margin:14px 0 4px;color:var(--acc);font-size:16px}
.sub{color:var(--mut);margin:0 0 10px}
canvas{width:100%;height:70px;display:block;border-radius:12px;background:#08101d;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button{font:inherit;color:var(--tx);background:#1a2745;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.12s}
button:hover{border-color:var(--acc);transform:translateY(-1px)}button:focus-visible{outline:3px solid var(--acc)}
.pri{background:linear-gradient(135deg,#1694d6,#2ee59d);color:#04121c;font-weight:700;border:0}
.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ch{text-align:left;width:100%}.ch b{display:block;font-size:17px}.ch small{color:var(--mut)}
.bar{height:10px;background:#0a1324;border-radius:9px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .5s}
.hud{display:flex;gap:12px;justify-content:space-between;align-items:center;font-weight:600;flex-wrap:wrap}
.hearts{font-size:22px;letter-spacing:2px}.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:#0a1324;border:1px solid var(--line);color:var(--mut)}
.q{font-size:18px;white-space:pre-line;margin:8px 0 12px}
.opt{display:flex;gap:10px;text-align:left;width:100%;margin:8px 0;align-items:flex-start}.opt kbd{background:#0a1324;border:1px solid var(--line);border-radius:7px;padding:0 8px;color:var(--acc);font-weight:700}
.opt.ok{background:#0f3b2c;border-color:var(--ok)}.opt.bad{background:#42121e;border-color:var(--bad)}.opt[disabled]{cursor:default;transform:none}
.fb{border-left:4px solid var(--ok);padding:8px 12px;background:#0a1324;border-radius:8px;margin-top:10px}.fb.bad{border-color:var(--bad)}.fb small{color:var(--mut);display:block;margin-top:6px}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.pop{animation:pp .4s}@keyframes pp{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.note li,.note p{margin:4px 0}.note h3{border-top:1px solid var(--line);padding-top:10px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:#201600;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:9}
.stars{color:var(--gold);letter-spacing:2px}.big{font-size:44px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
const Q=[{"c": 4, "q": "Knowledge/Terminology: What are three important elements that contribute to spread of infection in health care?", "o": ["Host, reservoir, vector", "Modifiable, patient, equipment,", "Source/reservoir, host, route of transmission", "Source/reservoir, route of transmission, humans"], "a": 2, "e": "reservoir, host, route of transmission are correct elements of transmission to spread infection. (Mendoza, 2026, slide 7). 2. Troubleshoot/ “what should RT do?”", "s": "Mendoza, M (2026), Egan’s chapter 4, principles of infection and control, 2027 NBRC", "l": "Knowledge"}, {"c": 4, "q": "A 72-year-old patient receiving chemotherapy is mechanically ventilated through an endotracheal tube. The RT recognizes that the patient has several factors that increase susceptibility to infection. What type of chain of infection is this and what action should the RT do that would best reduce modifiable infection risk to this patient?", "o": ["Sources and reservoirs; Increase the oxygen concentration.", "Susceptible host; Limit unnecessary manipulation of the endotracheal tube.", "Sources and reservoirs; Discontinue chemotherapy.", "Route of transmission; Transfer patient to a younger patient care unit."], "a": 1, "e": "Age and chemotherapy are already immunocompromised risks under nonmodifiable susceptible hosts. Careful management of devices and unnecessary manipulation of endotracheal tubes can reduce infection control risk (Mendoza, 2026, slide 10).", "s": "Mendoza, M (2026), Egan’s chapter 4, principles of infection and control, 2027 NBRC", "l": "Knowledge"}, {"c": 4, "q": "A patient’s recent culture comes back positive for MRSA, but the patient shows no symptoms. A reusable nebulizer from that patient has been left out on the table. Which option best identifies potential courses or reservoirs?", "o": ["Only the patient", "Both, the patient and the contaminated equipment", "The contaminated equipment", "The room air from a positive MRSA culture"], "a": 1, "e": "Both because it is a colonized patient and contaminated equipment are both sources of reservoir (Mendoza, 2026, slide 9). Routes of Transmission (Andrew)", "s": "Mendoza, M (2026), Egan’s chapter 4, principles of infection and control, 2027 NBRC", "l": "Knowledge"}, {"c": 4, "q": "Knowledge/terminology: Which of the following best describes direct contact transmission?", "o": ["A pathogen spreads through small airborne particles", "A pathogen passes directly from an infected person to another person", "A pathogen spreads through contaminated medical equipment", "A pathogen is transmitted through contaminated food or water"], "a": 1, "e": "Direct contact transmission occurs when a pathogen is transferred directly from one person to another (Messam & Fraser, 2025, p. 47).", "s": "", "l": "Knowledge"}, {"c": 4, "q": "Application/Critical thinking: A respiratory therapist touches a contaminated ventilator surface and then touches their eyes without performing hand hygiene. Which Route of Infection Transmission best describes this situation?", "o": ["Airborne Transmission", "Indirect Contact Transmission", "Droplet Transmission", "Vector Transmission"], "a": 1, "e": "Indirect Contact Transmission This situation is an example of indirect contact transmission because the respiratory therapist touches a contaminated ventilator surface and then transfers the pathogen to their eyes without performing hand hygiene. Chapter 4 explains that indirect contact transmission occurs when a pathogen is transferred through a contaminated intermediate object, or fomite, such as medical equipment (Messam & Fraser, 2025, p. 47). Standard precautions (Lilly)", "s": "", "l": "Application"}, {"c": 4, "q": "Knowledge/terminology : Which statement correctly describes Standard Precautions?", "o": ["They are used only when a patient has a confirmed infectious disease.", "They are used for all patients, regardless of known diagnosis, with PPE selected based on anticipated exposure.", "They require healthcare workers to wear gloves for every patient encounter.", "They are used only when caring for patients with respiratory infections."], "a": 1, "e": "Standard Precautions are used with all patients in healthcare settings. The specific PPE is selected according to the anticipated exposure, rather than simply the patient's diagnosis.", "s": "", "l": "Knowledge"}, {"c": 4, "q": "Understanding/ Interpretation: An RT is caring for a patient who has no known infectious disease. The RT is preparing to perform a procedure that may expose them to the patient’s respiratory secretions. Which statement best explains the appropriate use of Standard Precautions?", "o": ["PPE should be selected based on the anticipated exposure to the patient’s secretions.", "PPE is unnecessary because the patient has no known infection.", "An N95 respirator is automatically required because respiratory secretions are present.", "Gloves are required, but hand hygiene is unnecessary if gloves are worn."], "a": 0, "e": "Standard Precautions apply regardless of known diagnosis, and PPE should be selected according to the anticipated exposure. The presence of respiratory secretions does not automatically mean an N95 is required; the RT should determine which barriers are appropriate for the anticipated exposure. (Egan Ch. 4, NBRC Student Resource, pp. 4-5).", "s": "", "l": "Understanding"}, {"c": 4, "q": "Clinical Scenario: An RT is preparing to suction a patient who has no known infectious disease. The procedure is expected to involve contact with respiratory secretions and possible splashing toward the RT’s face. Which action is most appropriate?", "o": ["Perform hand hygiene and select PPE based on the anticipated exposure, including gloves and protection against possible splashes.", "Wear gloves only because the patient has no known infectious disease.", "Skip PPE because Standard Precautions are only required for patients with confirmed infections.", "Automatically place the patient in airborne isolation and wear an N95 respirator."], "a": 0, "e": "Standard Precautions apply to all patients, regardless of known diagnosis. PPE is selected based on the anticipated exposure. Because suctioning may involve contact with respiratory secretions and possible splashing, gloves and appropriate protection against splashes should be selected. (Mendoza PowerPoint, Slides 16 and 19; Egan Ch.4). PPE & Isolation (Marissa):", "s": "", "l": "Clinical"}, {"c": 4, "q": "Gloves are an important type of personal protective equipment (PPE). Which statement best explains how wearing gloves protects both the patient and the healthcare worker?", "o": ["Gloves eliminate the need for hand hygiene when providing patient care.", "Gloves create a barrier that helps protect patients from pathogens on the healthcare worker’s hands and protects healthcare workers from contact with blood, body fluids, secretions, and other potentially contaminated materials.", "Gloves are required for every interaction with every patient, regardless of the type of contact.", "Gloves prevent contamination as long as the same pair is worn throughout the healthcare worker’s shift."], "a": 1, "e": "Gloves provide a protective barrier in both directions. They reduce the chance of transferring pathogens from the healthcare worker’s hands to the patient and protect the healthcare worker’s hands from potentially infectious material. Gloves do not replace hand hygiene and must be changed between patients and when moving from a contaminated body site to a clean body site. Understanding / Interpretation — Airborne Precautions", "s": "Egans Ch.4 pg.50", "l": "Knowledge"}, {"c": 4, "q": "Based on the different modes of transmission, there are specific transmission-based precautions for each mode. For a patient requiring airborne precautions, what PPE should a healthcare worker use before entering the patient’s room, and what special room requirement is needed?", "o": ["Surgical mask and a positive-pressure room", "N95 respirator and a negative-pressure room", "Surgical mask and a negative-pressure room", "N95 respirator and a positive-pressure room"], "a": 1, "e": "Airborne pathogens can remain suspended in the air and may be inhaled. An N95 respirator helps protect the healthcare worker from inhaling these infectious particles. The patient should be placed in a negative-pressure room, which keeps contaminated air from flowing out of the patient’s room and into surrounding areas. Critical Thinking / Application — Protective Environment Question:", "s": "Egans Chapter 4 page 54-55", "l": "Knowledge"}, {"c": 4, "q": "An RT has just started their shift and is reviewing the case of their first patient. The patient recently underwent an allogeneic hematologic stem-cell transplant and requires a protective environment. Which room setup would be most appropriate to reduce the patient’s exposure to environmental pathogens?", "o": ["Negative room pressure with air exhausted directly outside and at least 6 air changes per hour.", "Positive room pressure with HEPA filtration of incoming air, directed airflow, a well-sealed room, and at least 12 air changes per hour.", "Positive room pressure with recirculated unfiltered air and the room door kept open to increase ventilation.", "Negative room pressure with HEPA filtration of incoming air and at least 12 air changes per hour."], "a": 1, "e": "A protective environment is used to safeguard highly immunocompromised patients, including patients who have undergone an allogeneic hematologic stem-cell transplant. These patients have weakened immune systems, and their body’s ability to fight off infections is impaired. The protective environment includes HEPA filtration of incoming air, directed airflow, positive pressure relative to the corridor, a well-sealed room, and ventilation providing at least 12 air changes per hour. These measures help minimize the patient’s exposure to environmental pathogens, including fungal spores. Medical Devices and VAE Prevention (AJ)", "s": "Egans Chapter 4 page 55", "l": "Knowledge"}, {"c": 4, "q": "Which intervention is most appropriate to help prevent ventilator-associated complications?", "o": ["Change the ventilator circuit every shift to reduce bacterial growth.", "Keep the head of the bed to improve pulmonary blood flow.", "Elevate the head of the bed 30-45 degrees and assess the patient’s readiness to decrease sedation and liberate from mechanical ventilation.", "Allow condensation to remain in the ventilator tubing until the circuit is changed."], "a": 2, "e": "This is right because the ventilator circuit should be changed only if it’s visibly soiled, the head of the bed should not be flat, and the condensation must be drained away from the patient 14. Critical Thinking: What is the best way to decrease host susceptibility to a device related infection? To decrease a device related infection, you would firstly limit the device use and second ensure that devices are placed and maintained appropriately.", "s": "", "l": "Clinical"}, {"c": 4, "q": "(Troubleshooting) A mechanically ventilated patient has been receiving ventilator support for 4 days. During a ventilator safety check, the nurse notices that the head of the bed is at a 15-degree angle. The patient has not had a sedation interruption or spontaneous breathing trial, and oral care has been done earlier that day. Which action should the nurse take first to help reduce the patient’s risk of a ventilator associated event (VAE)?", "o": ["Change the ventilator circuit immediately", "Elevate the head of the bed to 30-45 degrees", "Increase the patient’s oxygen concentration", "Perform oral care on the patient"], "a": 1, "e": "The correct answer is B. Found on page 56 of Egan’s Cleaning, Disinfection, Sterilization (Rosa) 16. Knowledge/ Terminology: Which option correctly lists the medical equipment in order from low-level disinfection, intermediate-level disinfection, and high-level disinfection? - A. Blood pressure cuff, spirometer used on a patient exposed to M. tuberculosis, Laryngoscope blade - Laryngoscope blade, Blood pressure cuff, Bronchoscope biopsy forceps - Bronchoscope biopsy forceps, Ventilator circuit, Face mask - Face mask, Bronchoscope biopsy forceps, Outer spirometer exposed to M. tuberculosis Correct Answer (A) Table 4.1 Equipment processing defi", "s": "", "l": "Troubleshooting"}, {"c": 4, "q": "Understanding/ Interpretation: Which respiratory device is correctly paired with its Spaulding risk classification and mandatory processing level?", "o": ["Bronchoscope biopsy forceps — Critical item; requires complete sterilization", "Laryngoscope blade — Noncritical item; requires neutral detergent washing only", "Ventilator circuit — Critical item; requires steam autoclaving", "Blood pressure cuff — Semicritical item; requires high-level disinfection"], "a": 0, "e": "Table 4.2 processing a medical equipment according to infection risk categories Pg 57 (Egan’s) Since the bronchoscope biopsy forceps break the mucosal barrier to enter body tissue, it would be categorized as a critical item that requires complete sterilization. Laryngoscope blades and ventilator circuits also contact mucus membranes but the skin is intact, making them a semi critical item that needs high-level disinfection and blood pressure cuffs only touch intact skin making them a non-critical item requiring no to intermediate disinfection.", "s": "", "l": "Understanding"}, {"c": 4, "q": "Troubleshoot/ “What should RT do?”- An RT is establishing a reprocessing protocol for reusable laryngoscope blades. Which step-by-step sequence correctly follows infection control standards from start to finish?", "o": ["Step 1: High-level disinfection, Step 2: Physical detergent washing, Step 3: Low-level surface spray", "Step 1: Thorough physical cleaning to remove organic debris, Step 2: High-level disinfection with an FDA-cleared agent, Step 3: Rinsing, drying, and clean storage", "Step 1: Steam sterilization, Step 2: Detergent washing, Step 3: Antiseptic wiping", "Step 1: Low-level disinfectant spray, Step 2: Immediate reuse without washing"], "a": 1, "e": "Table 4.1 Equipment processing definitions (Egan’s) Pg57 According to the textbook, you should always start with cleaning, disinfection or sterilization, followed by proper rinsing, drying and proper storage. Spaulding Classifications (Ernesto)", "s": "", "l": "Troubleshooting"}, {"c": 4, "q": "A respiratory therapist, after assisting in a bronchoscopy begins to prepare the reusable bronchoscope for the next patient. According to the Spaulding classification, which of the following is the minimum required level of processing for the bronchoscope?", "o": ["Cleaning only", "Low-level disinfection", "High-level disinfection", "Sterilization"], "a": 2, "e": "A bronchoscope contacts the patient’s mucous membranes, making it a semicritical device. Semicritical equipment requires at least high-level disinfection before reuse. 20. Clinical Scenario Questions: Bronchoscopy Biopsy Forceps", "s": "Egan’s Chapter 4, page 56-57. Table 4.2", "l": "Knowledge"}, {"c": 4, "q": "Following a bronchoscopy, the respiratory therapist is assisting with reprocessing the reusable biopsy forceps. Because the forceps entered normally sterile tissue during the procedure, which of the following is the MOST appropriate action?", "o": ["Clean and perform low-level disinfection", "Perform intermediate-level disinfection", "Perform high-level disinfection only", "Clean and sterilize, according to the manufacturer's instructions"], "a": 3, "e": "Forceps used in a biopsy that enter normally sterile tissue are classified as critical equipment. Critical equipment has the greatest infection risk and therefore requires sterilization before reuse. Manufacturer instructions for use should also be followed. 21. Clinical Scenario Questions: Selecting the Appropriate Processing Method", "s": "Egan’s Chapter 4, page 56-57. Table 4.2", "l": "Knowledge"}, {"c": 4, "q": "A respiratory therapist is responsible for reprocessing several pieces of equipment after patient care. Which of the following equipment-processing combinations is correct?", "o": ["External ventilator surface — critical — sterilization", "Bronchoscope — semicritical — high-level disinfection", "Blood pressure cuff — semicritical — high-level disinfection", "Bronchoscope biopsy forceps — noncritical — low-level disinfection"], "a": 1, "e": "A bronchoscope contacts mucous membranes, so it is semicritical and requires at least high-level disinfection. External ventilator surfaces and blood pressure cuffs normally contact intact skin or the environment and are noncritical. Biopsy forceps that enter sterile tissue are critical and require sterilization. Respiratory Equipment Rules- Marissa", "s": "Egan’s Chapter 4, page 56-57. Table 4.2", "l": "Knowledge"}, {"c": 4, "q": "A respiratory therapist is providing treatment to a patient using a large-volume jet nebulizer. During the treatment, the RT notices that the fluid in the reservoir is running low, but there is still residual fluid present and the treatment is not complete. What should the RT do next?", "o": ["Add sterile water directly to the remaining fluid in the reservoir to continue the treatment.", "Add distilled water to the remaining fluid because distilled water is considered sterile.", "Discard the remaining fluid and refill the reservoir with the appropriate fresh sterile fluid before continuing the treatment.", "Continue operating the nebulizer until the reservoir is completely dry before adding additional fluid."], "a": 2, "e": "Residual fluid in a nebulizer reservoir should not be topped off because remaining fluid can become contaminated. The RT should discard the residual fluid and use fresh sterile fluid when required rather than adding new fluid to what is already present. This helps reduce the risk of contamination and infection. 23. Troubleshooting / What Should the RT Do? — Open Suctioning", "s": "Egans chapter 4-page 59 box 4.6", "l": "Troubleshooting"}, {"c": 4, "q": "Two respiratory therapists are providing care to a patient with a tracheostomy who requires open suctioning. After suctioning the patient’s airway, one RT notices that the suction catheter contains secretions. The other RT suggests rinsing the catheter with tap water and reusing it for the patient’s next suctioning procedure. What next steps should the RT take to troubleshoot this situation?", "o": ["Rinse the catheter with tap water and reuse it because it will only be used on the same patient.", "Rinse the catheter with sterile water and save it for the patient’s next suctioning procedure.", "Discard the used catheter, perform appropriate hand hygiene, and use a new sterile single-use catheter and sterile fluids for the next open suctioning procedure.", "Wipe the outside of the catheter with disinfectant and reuse it once it has dried."], "a": 2, "e": "Open suctioning increases the risk of introducing microorganisms into the patient’s airway. To minimize contamination, sterile techniques must be used, including proper hand hygiene and gloves. A fresh sterile, single-use catheter should be used for each open suctioning procedure, and only sterile fluids should be used when fluids are required. The used catheter should not be rinsed with tap water and saved for reuse because this can introduce microorganisms into the patient’s airway and increase the patient’s risk of infection. 24. Critical Thinking / Application — Bronchoscope Reprocessing", "s": "Egans chapter 4 page 60 and NBRC material", "l": "Troubleshooting"}, {"c": 4, "q": "An RT has completed a bronchoscopy and is preparing the bronchoscope for reuse on another patient. The bronchoscope was pre-cleaned immediately at the point of use. To reduce the risk of transmitting microorganisms to the next patient, which sequence should the RT follow to properly reprocess the bronchoscope?", "o": ["Manual cleaning → leak testing → high-level disinfection → rinsing → drying → proper storage", "Leak testing → manual cleaning → high-level disinfection → rinsing → drying → proper storage", "Leak testing → high-level disinfection → manual cleaning → rinsing → drying → proper storage", "Manual cleaning → high-level disinfection → leak testing → rinsing → drying → proper storage"], "a": 1, "e": "Bronchoscopes can become contaminated with high levels of microorganisms during use because of the body cavities in which they are used. Proper reprocessing is important to reduce the risk of transmitting microorganisms between patients. After point-of-use pre-cleaning, the critical steps include leak testing, manual cleaning, high-level disinfection, rinsing, drying, and proper storage. Failure to follow recommended cleaning and disinfection procedures can increase the risk of healthcare-associated infection Fluids, Medications, Sharps, and Specimen- Rosa", "s": "Egans chapter 4 page 60 and NBRC material", "l": "Knowledge"}, {"c": 4, "q": "A respiratory therapist has just finished drawing medication from a vial using a needle and syringe. What is the proper action for the used needle?", "o": ["Recap the needle and place it in the regular trash", "Break the needle before disposal", "Immediately place the needle in an approved sharps container", "Place the needle on the medication cart until the procedure is complete"], "a": 2, "e": "Ppt.Chapter 4 slide 42 used needles are to immediately go into a sharps container and should never be recapped, bent, or broken.", "s": "", "l": "Knowledge"}, {"c": 4, "q": "A respiratory therapist is using a large-volume nebulizer. The reservoir still contains some water from the previous treatment, and the RT notices that the water level is low. What should the RT do?", "o": ["Add sterile water to the remaining water to bring the reservoir back to the correct level", "Add tap water to the remaining water", "Discard the remaining water, clean/process the reservoir as required, and refill it with fresh sterile water", "Continue using the reservoir until it is completely empty"], "a": 2, "e": "PPT chapter 4 slide 42 you should never top off a large volume nebulizer, remaining fluid can be contaminated so it’s best to discard old fluid before adding fresh sterile water", "s": "", "l": "Troubleshooting"}, {"c": 4, "q": "A respiratory therapist collects a sputum specimen from a patient. Before transporting it to the laboratory, the RT realizes the specimen has been left on the counter outside the patient’s room. What should the RT do?", "o": ["Return the specimen to the patient’s room and continue as normal", "Treat the specimen as a biohazard, use appropriate precautions, and place it in the proper labeled specimen container/biohazard transport bag", "Pour the specimen into a regular waste container", "Leave the specimen uncovered so the laboratory can identify it"], "a": 1, "e": "PPT Chapter 4 Slide 42 you should always treat specimens as a biohazard or potentially infectious. Always follow infection control precautions to make sure the specimen is properly contained and transported.", "s": "", "l": "Troubleshooting"}, {"c": 6, "q": "What is the critical temperature of a substance?", "o": ["The temperature at which a liquid begins to boil", "The highest temperature at which a gas can be liquefied by increasing pressure", "The pressure required to change a liquid into a gas", "The temperature at which a gas reaches its maximum flow rate"], "a": 1, "e": "The critical temperature is the highest temperature at which a gas can be turned into a liquid by applying pressure alone. Above this temperature, increasing pressure alone cannot turn the gas into a liquid.", "s": "Egan’s Fundamentals of Respiratory Care, Chapter 6 page103", "l": "Application"}, {"c": 6, "q": "A gas is above its critical temperature. What happens if pressure increases?", "o": ["The gas will always become a liquid", "The gas will become a solid", "The gas cannot be liquefied by pressure alone", "The gas will reach its critical pressure and automatically liquefy"], "a": 2, "e": "Once a gas is above its critical temperature, pressure alone cannot cause the gas to turn into a liquid. The temperature must first be reduced below the critical temperature for pressure to be effective in producing a liquid.", "s": "Egan’s Fundamentals of Respiratory Care, Chapter 6 page103", "l": "Application"}, {"c": 6, "q": "An RT is examining a gas cylinder and wants to understand how much pressure would be required to liquefy a gas at its critical temperature. Which concept is most relevant?", "o": ["Critical pressure", "Laminar flow", "Transitional flow", "Vapor pressure"], "a": 0, "e": "Critical pressure is the pressure required to liquefy a substance at its critical temperature. Understanding this relationship helps explain how gases behave when pressure and temperature are changed.", "s": "Egan’s Fundamentals of Respiratory Care, Chapter 6 page 103", "l": "Application"}, {"c": 6, "q": "An RT delivers oxygen through a respiratory therapy device. The gas is moving through a straight, narrow tube at a relatively low flow rate. The gas molecules move in relatively parallel layers with little mixing between the layers. What type of flow is occurring?", "o": ["Turbulent flow", "Transitional flow", "Laminar flow", "Chaotic flow"], "a": 2, "e": "Laminar flow occurs when gas or liquid moves in smooth, parallel layers. It is more likely to occur with lower flow rates and smaller changes in direction, while higher flow rates and disturbances can produce turbulence. 5. Troubleshooting / “What should the RT do?”", "s": "Egan’s Fundamentals of Respiratory Care, Chapter 6 page 104", "l": "Knowledge"}, {"c": 6, "q": "An RT notices that gas flowing through a respiratory therapy circuit has become unstable and is beginning to show characteristics between smooth laminar flow and fully turbulent flow. Which type of flow should the RT recognize?", "o": ["Laminar flow", "Transitional flow", "Static flow", "Diffusion flow"], "a": 1, "e": "Transitional flow occurs between laminar and turbulent flow. Recognizing this type of flow is important because changes in flow conditions can affect resistance and pressure within respiratory equipment and airways. Need to know - Critical temperature - The critical temperature of a gas is the temp at which a gas can no longer be turned back into a liquid with pressure alone - The temp of the gas must first be lower - Critical temp is the highest temp at which a substance can remain a liquid - Critical pressure - The pressure needed to liquify a gas at its critical temp. - Laminar flow - This flow is when a liquid moves in a smooth manner - T", "s": "Egan’s Fundamentals of Respiratory Care, Chapter 6 page 106", "l": "Knowledge"}, {"c": 6, "q": "Which liquid property is responsible for thick mucus resisting movement. Terminology", "o": ["Density", "Adhesion", "Viscosity", "Capillary Action"], "a": 2, "e": "Stronger cohesive forces create a greater viscosity. Thick mucus have higher viscosity which will lead to a greater resistance to flow. This will lead the patient to have an increased work of breathing.", "s": "Egan’s Fundamentals of Respiratory Care, Ch.6 pg.90-91", "l": "Knowledge"}, {"c": 6, "q": "Capillary Action is best described as Interpretation", "o": ["Liquid in a small tube moving upward against gravity", "Counteracts with surface tension", "Buoyancy", "Pascal’s principle describing pressure"], "a": 0, "e": "Capillary action involves both adhesive and surface tension. The adhesion forces between the water molecules and the wall of the tube cause the upward force producing a concave meniscus. A patient with respiratory distress develops alveolar collapsation. The RT explains that surfactant helps prevent alveolar collapsation.", "s": "Egan’s Fundamentals of Respiratory Care, Ch.6 pg.92", "l": "Understanding"}, {"c": 6, "q": "Which statement best explains how surfactants work?", "o": ["It increases surface tension of alveolar fluid", "It decreases surface tension of alveolar fluid", "Increase of viscosity in blood", "It increases the cohesive forces between water molecules"], "a": 1, "e": "Surfactants in the alveoli counteract the surface tension. As the radius of the alveoli decreases, which in this case the alveoli collapse, the internal surface area decreases, but the volume of surfactant stays the same. Which means that the surfactant layer becomes increasingly thicker, decreasing the surface tension. A respiratory therapist places a drop of water on a smooth surface. The water molecules become attracted to one another and stick together.", "s": "Egan’s Fundamentals of Respiratory Care, Ch.6 pg.92", "l": "Knowledge"}, {"c": 6, "q": "This attraction is known as", "o": ["Cohesion", "Viscosity", "Surface tension", "Adhesion"], "a": 0, "e": "Cohesion is attractive force between like molecules", "s": "Egan’s Fundamentals of Respiratory Care, Ch.6 pg.91", "l": "Knowledge"}, {"c": 6, "q": "A therapist notices that moisture is accumulating inside the tube and traveling along its walls. What is most likely contributing to this problem? Question", "o": ["Laplace’s Law", "Boyle’s Law", "Capillary action", "Diffusion"], "a": 2, "e": "Capillary action causes liquids to move through small tubes because of the adhesive and cohesive forces. The adhesive force between the molecule and the tube’s wall and the cohesive forces between the water molecules lead them to come together and accumulate inside the tube.", "s": "Egan’s Fundamentals of Respiratory Care, Ch.6 pg. 92", "l": "Troubleshooting"}, {"c": 6, "q": "A premature baby has not developed surfactant. Which possible consequence can a respiratory therapist expect?", "o": ["Reduction of collapsed alveolar", "Pascal’s Law", "Low viscosity", "Increase surface tension and lead to alveolar collapsation"], "a": 3, "e": "Inadequate amount of surfactant in premature babies leads to collapsed alveoli due to high surface tension. Max’s Questions", "s": "Egan’s Fundamentals of Respiratory Care, Ch.6 pg.92", "l": "Knowledge"}, {"c": 6, "q": "What physics concept best describes how venturi masks achieve precise FiO2?", "o": ["Law of continuity", "Buoyancy", "Jet entrainment", "Bernoulli’s principle"], "a": 2, "e": "The reason is because jet entrainment involves the process of pushing high velocity 100% FiO2 through a narrow tube. Using Bernoulli’s principle, which states that as air velocity increases its pressure decreases, the pressure in the tube becomes lower than the air pressure outside of the tube. This causes room air to be pulled into the tube and mix with the 100% Fi02. By changing the size of opening into the tube, precise FiO2 can be set.", "s": "Egan’s Ch. 6 page 105", "l": "Knowledge"}, {"c": 6, "q": "Which of the following factors lead to a reduction in turbulence?\n1. Gas velocity\n2. Gas density\n3. Tube diameter\n4. Viscosity", "o": ["1 and 2", "1, 2, and 3", "1 and 3", "4"], "a": 3, "e": "Increasing gas velocity, gas density, or tube diameter all increase the likelihood of turbulence. Increasing gas viscosity decreases the likelihood.", "s": "Egan’s Ch. 6 page 105", "l": "Knowledge"}, {"c": 6, "q": "Using the law of continuity solve the following problem. A fluid is traveling through a pipe with a diameter of 12 cm. The pipe branches into 4 pipes each being 3 cm in diameter. How is the velocity in the final 4 pipes affected compared to the starting pipe? Use the formula: Cross sectional area = 3.14(r2)", "o": ["It is lower", "It is the same", "It is higher", "It doesn’t matter, nothing matters after all"], "a": 2, "e": "According to the law of continuity, the velocity of a fluid moving through a tube varies inversely with the tubes cross sectional area. Because the cross sectional area of the large pipe is 113.1 cm2 and the total cross sectional area of the four smaller pipes is 28.3 cm2, the fluid velocity in the four smaller pipes moves 4 times faster.", "s": "Egan’s Ch. 6 page 106", "l": "Knowledge"}, {"c": 6, "q": "A patient named Gormund is having an asthma exacerbation. His airways are constricted and are filled with heavy secretions. You give Gormund a heliox oxygen mixture. How would you expect Reynold’s number to be affected?", "o": ["It increases", "It stays the same", "It decreases", "Reynold’s number is unrelated to this scenario"], "a": 2, "e": "Reynold’s number gives an approximation of the likelihood of turbulence occurring. Increasing gas velocity, gas density, or tube diameter all increase the likelihood of turbulence. Increasing gas viscosity decreases the likelihood. Because you gave Gormund heliox oxygen mixture, which is much less dense than regular oxygen air mixtures, Reynold’s number goes down.", "s": "Egans Ch. 6 page 105", "l": "Knowledge"}, {"c": 6, "q": "You notice Uncle Hank’s SpO2 has risen to 99% when it normally sits somewhere around 90%. He is wearing a venturi mask which is set to exactly 50% FiO2 and is turned on. You notice he has fallen asleep with his mask against his pillow. What would you check first to determine what the problem is?", "o": ["Check the air entrainment ports are blocked", "Check if he is having an asthma attack", "Check his 2 forms of identification", "Collect an ABG"], "a": 0, "e": "Venturi masks have air entrainment ports which pull in ambient air. This air mixes with 100% FiO2 allowing for a precise FiO2 to be set. If the ports are blocked, the patient will receive 100% FiO2", "s": "Eagans Ch. 6 page 105", "l": "Knowledge"}, {"c": 6, "q": "You want to increase the FiO2 provided by a patient’s venturi mask. To accomplish this how would you adjust the venturi mask?", "o": ["Tighten the mask strap", "Narrow the air entrainment ports", "Inject albuterol into their pedal artery", "Widen the air entrainment ports"], "a": 3, "e": "Narrowing the ports will reduce the amount of room air entering the mask. This means the ratio of 100% FiO2 to room air is increased. Alana’s Questions", "s": "Egans Ch. 6 page 107", "l": "Knowledge"}, {"c": 6, "q": "Knowledge | Which set correctly matches each bedside example with its heat-transfer mechanism?", "o": ["Direct contact with a warm pad: convection; moving warm air: radiation; overhead warmer: conduction", "Direct contact with a warm pad: conduction; moving warm air: convection; overhead warmer: radiation", "Direct contact with a warm pad: radiation; moving warm air: conduction; overhead warmer: convection", "Direct contact with a warm pad: conduction; moving warm air: radiation; overhead warmer: convection"], "a": 1, "e": "Conduction needs contact between surfaces. Convection carries heat in moving air or liquid, while radiation transfers energy without the warmer touching the patient.", "s": "Egan's Fundamentals of Respiratory Care (2024), ch. 6, pp. 86-87; RCARE-33 Physics at the Bedside REVISED, slide 9; Respiratory Physics Blueprint, p. ", "l": "Knowledge"}, {"c": 6, "q": "Understanding | An RT notices that an unheated humidifier cools while water evaporates into passing gas. Why can evaporation cool the nearby gas and water?", "o": ["Evaporation releases latent heat as vapor returns to liquid.", "Evaporation requires energy to separate water molecules into vapor, drawing heat from the surroundings.", "Water can vaporize only after the whole circuit reaches its boiling point.", "Moving gas eliminates the need for energy during a phase change."], "a": 1, "e": "Liquid-to-vapor change requires latent heat to overcome molecular attraction. Without enough replacement heat, that energy comes from nearby water and gas, which can cool; evaporation can occur below the boiling point.", "s": "Egan's (2024), ch. 6, pp. 85, 87-89; RCARE-33 lecture, slides 8-10; Respiratory Physics Blueprint, pp. 2-4.", "l": "Understanding"}, {"c": 6, "q": "Application | An RT compares a device specification of 95°F with a monitor that displays °C and a gas-law worksheet that requires K. Which pair of values should the RT use?", "o": ["63°C and 336 K", "35°C and 95 K", "35°C and 308 K", "25°C and 298 K"], "a": 2, "e": "(95 - 32) × 5/9 = 35°C; 35 + 273 = 308 K. Gas-law calculations use absolute temperature in kelvin.", "s": "Egan's (2024), ch. 6, pp. 87-88; RCARE-33 lecture, slide 12; Respiratory Physics Blueprint, p. 4; Chapter 6 FAQ, item 2.", "l": "Application"}, {"c": 6, "q": "Clinical Scenario | A newborn under an overhead radiant warmer cools after a nearby door opens and cooler air moves across the infant. No cool object is touching the patient. What is the best explanation and response?", "o": ["Conduction is the cause; add a warmer contact surface without checking the airflow.", "Radiation is the only factor; ignore the moving air and turn up the warmer.", "Convection adds heat loss; reduce the draft if possible and reassess temperature", "Sublimation is the cause; change the oxygen concentration to stop it."], "a": 2, "e": "Moving cooler air carries heat away by convection. The radiant warmer can still add energy at the same time, so reducing the new draft and reassessing addresses the additional loss.", "s": "Egan's (2024), ch. 6, pp. 86-87; RCARE-33 lecture, slide 9; Respiratory Physics Blueprint, p. 3.", "l": "Clinical"}, {"c": 6, "q": "| A fluidic respiratory device uses a gas jet attaching to a curved wall to switch flow between outlets. The output stops switching as expected, and delivered support appears unreliable. What should the RT do first?", "o": ["Assess the patient and confirm adequate ventilation; arrange approved backup support if needed before investigating the device.", "Increase driving flow above the device limits to force the jet against the wall.", "Assume a moving valve is stuck and dismantle the device while it remains in use.", "Wait until the next scheduled check because fluidic devices have no moving parts."], "a": 0, "e": "Coanda wall attachment helps a fluidic jet change direction without a conventional moving valve, but a device can still fail to deliver intended support. Assess and support the patient first; then check the device and gas-flow path according to its procedure Marthy’s Questions", "s": "Egan's (2024), ch. 6, p. 107 and fig. 6.26; RCARE-33 lecture, slides 41 and 46; Clinical Physics Corps, p. 7; Respiratory Physics Blueprint, p. 12; Ch", "l": "Troubleshooting"}, {"c": 6, "q": "A gas sample contains 12 mg/L of water vapor. At its current temperature, fully saturated gas could contain 20 mg/L. Which statement is correct?", "o": ["Its absolute humidity is 60%, and its relative humidity is 12 mg/L.", "Its absolute humidity is 12 mg/L, and its relative humidity is 60%.", "Its absolute humidity is 20 mg/L, and its relative humidity is 40%.", "Its relative humidity cannot be determined without barometric pressure."], "a": 1, "e": "Absolute humidity is the actual content, 12 mg/L. Relative humidity is 12 ÷ 20 × 100 = 60%.", "s": "RCARE33 Chapter 6: Physics at the Bedside, slide 30.", "l": "Knowledge"}, {"c": 6, "q": "Humidified gas travels through a circuit and gradually cools. Its absolute humidity initially stays constant. Which sequence should the RT expect?", "o": ["Water vapor capacity rises → RH falls → condensation occurs.", "Water vapor capacity falls → RH rises → dew point is reached → condensation can occur.", "Absolute humidity rises → RH falls → dew point is reached.", "Water vapor becomes oxygen → partial pressure rises → condensation occurs."], "a": 1, "e": "Cooling reduces water vapor capacity. RH rises even while AH initially stays the same. At the dew point, RH reaches 100%; further cooling causes condensation.", "s": "RCARE33 Chapter 6: Physics at the Bedside, slides 30–31.", "l": "Knowledge"}, {"c": 6, "q": "Two patients have the same alveolar-to-blood oxygen partial pressure difference. Patient A has a normal alveolar membrane. Patient B has fluid increasing the thickness of the barrier between alveolar gas and blood. Which result is most likely?", "o": ["Oxygen diffuses faster in Patient B because fluid increases humidity.", "Oxygen diffuses more slowly in Patient B because it must cross a thicker barrier.", "Oxygen diffusion is identical because the pressure differences are equal.", "Oxygen stops diffusing entirely in Patient B."], "a": 1, "e": "Even with the same pressure difference, a thicker barrier slows oxygen transfer.", "s": "RCARE33 Chapter 6: Physics at the Bedside, slide 44.", "l": "Knowledge"}, {"c": 6, "q": "A ventilated patient’s circuit has visible rainout. A classmate says, “The water proves the patient is receiving adequate humidity.” Which response is most accurate?", "o": ["Correct; any condensation confirms adequate humidity at the patient airway.", "Correct; visible condensation confirms the gas is at 37°C at the patient.", "Incorrect; rainout shows that gas cooled enough to condense, but it does not by itself confirm humidity delivery at the patient.", "Incorrect; rainout can occur only if the humidifier has no water."], "a": 2, "e": "Rainout shows condensation occurred somewhere in the circuit. It does not, by itself, establish the humidity delivered at the patient airway. 5. Troubleshooting / What should the RT do?", "s": "RCARE33 Chapter 6: Physics at the Bedside, slides 31 and 33.", "l": "Knowledge"}, {"c": 6, "q": "An RT notices heavy rainout collecting in the inspiratory limb near an intubated patient. Which action is best?", "o": ["Lift the tubing above the patient so the water runs toward the airway.", "Protect the patient from the collected water, manage the condensate according to facility procedure, and check why the gas is cooling in the circuit.", "Turn off the humidifier because any condensation means the gas is too humidified.", "Ignore the water if the ventilator has not alarmed."], "a": 1, "e": "Keep pooled water from reaching the patient or obstructing flow, then troubleshoot the circuit and temperature setup. Destiny", "s": "RCARE33 Chapter 6: Physics at the Bedside, slides 31 and 33.", "l": "Knowledge"}, {"c": 6, "q": "For respiratory care what situation best explains Henery’s Law?", "o": ["Gas expanding as atmospheric pressure decreases", "Air moving slow through a narrowed airway", "Oxygen and nitrogen each working to total atmospheric pressure", "Oxygen dissolving from the alveoli into the blood based partly on its partial pressure"], "a": 3, "e": "The amount of a gas that dissolves in a liquid depends partly on the partial pressure of that gas - In the lungs, a higher PO2 in the alveoli encourages more oxygen to dissolve into the blood.", "s": "Egan’s Fundamentals of Respiratory Care, Ch 6 Pg. 100", "l": "Knowledge"}, {"c": 6, "q": "According to Henry’s law, the amount of a gas that dissolves in a liquid is directly proportional to:", "o": ["The volume of the liquid only", "The total pressure of all gases regardless of their individual partial pressures", "The partial pressure of the gas and its solubility", "The molecular weight of the gas"], "a": 2, "e": "Henry’s law says the amount of gas that dissolves in a liquid depends on: Partial pressure x Solubility (↑ partial pressure → ↑ gas dissolved in liquid) - What is this statement referring to “At a constant temperature, the amount of gas is proportional to its partial pressure?” A. Gay-lussac’s law B. Dalton’s Law C Reynolds number D. Boyle’s law Answer: B According to Dalton’s law constant temperature", "s": "Egan’s Fundamentals of Respiratory Care, Ch 6 Pg. 99", "l": "Knowledge"}, {"c": 6, "q": "According to Dalton’s law, the total pressure exerted by a mixture of gases is equal to:", "o": ["The pressure of the gas with the highest concentration", "The sum of the partial pressures of each individual gas", "The pressure of oxygen multiplied by the pressure of nitrogen", "The amount of each gas dissolved in a liquid"], "a": 1, "e": "Total pressure is Ptotal = P1 + P2 + p3 +.... For example, atmospheric air contains oxygen, nitrogen, and other gases. Each contributes its own partial pressure to the total atmospheric pressure.", "s": "Egan’s Fundamentals of Respiratory Care, Ch 6 Pg. 99", "l": "Knowledge"}, {"c": 6, "q": "According to the Bernoulii principle, what happens when there is an increase in velocity of gas flowing through a tube?", "o": ["Gas temperature increases", "Lateral pressure increase", "Lateral pressure decreases", "Gas density increase"], "a": 2, "e": "s a tube narrows the velocity increases (gas speeds up) causing lateral pressure against the sides of the tube to decrease.", "s": "Egan’s Fundamentals of Respiratory Care, Ch 6 Pg. 106", "l": "Knowledge"}, {"c": 6, "q": "There is a patient in a hyperbaric chamber and the partial pressure of oxygen is increasing. According to Henry’s law, what happens to the amount of oxygen dissolved in the patient's plasma.", "o": ["It decrease", "I remains constant", "It disappears", "It increases"], "a": 3, "e": "Higher pressure = Higher dissolved gas", "s": "Egan's Fundamentals of Respiratory Care, Ch. 6", "l": "Knowledge"}, {"c": 6, "q": "According to Dalton's Law, what is the barometric total pressure?", "o": ["760 mmHG", "770 mmHg", "750 mmHg", "730 mmHg"], "a": 0, "e": "total pressure is Ptotal = P1 + P2 + p3 +....", "s": "", "l": "Knowledge"}, {"c": 6, "q": "A patient is breathing room air at sea level, where the barometric pressure is 760 mmHg. The RT wants to calculate the partial pressure of oxygen in dry atmospheric air. What is the approximate PO2?", "o": ["47 mmHg", "0.3mmHg", "150 mmHg", "160 mmHg"], "a": 3, "e": "PO2 =FO2 x PB Room air is 21% oxygen: 0.21 x 760 = 159.6 = 160mmHg  of Respiratory Care, Ch. 6", "s": "", "l": "Knowledge"}, {"c": 6, "q": "A patient's PaO2 increases from 80 to 160 mmHg. Assuming constant temperature, what happens to the amount of oxygen physically dissolved in blood?", "o": ["It quadruples", "It doubles", "It decreases by half", "It remains constant"], "a": 1, "e": "Henry’s law states that dissolved gas concentration is proportional to partial pressure at constant temperature.", "s": "Egan's Fundamentals of Respiratory Care, Ch. 6", "l": "Knowledge"}, {"c": 6, "q": "A patient receiving 28% oxygen is transported from sea level to a facility at a significantly higher altitude. The oxygen concentration remains set at 28%, but the patient's PaO₂ decreases. Which of the following BEST explains this change?", "o": ["The lower atmospheric pressure causes oxygen to diffuse more rapidly out of the blood.", "Oxygen becomes less soluble in plasma at higher altitude.", "The lower barometric pressure decreases the partial pressure of inspired oxygen despite the same oxygen concentration.", "The oxygen concentration decreases because nitrogen concentration increases."], "a": 2, "e": "At higher altitude, barometric pressure (PB) decreases, but the oxygen concentration can remain 28%. (decreased atmospheric/barometric pressure, making Dalton’s law the relevant principle.)", "s": "Egan's Fundamentals of Respiratory Care, Ch. 6", "l": "Knowledge"}, {"c": 6, "q": "A scuba diver ascends to the surface too rapidly after spending a long period of time at significant depth. Shortly afterward, the diver has signs of joint pain, dizziness, and difficulty breathing. Which of the following BEST explains what occurred?", "o": ["Increased atmospheric pressure caused oxygen to leave the blood.", "Rapidly decreasing pressure caused dissolved nitrogen to come out of solution and form bubbles.", "Decreased barometric pressure caused the fraction of inspired nitrogen to increase.", "Increased nitrogen solubility occurred as pressure decreased."], "a": 1, "e": "At depth, the increased pressure causes more nitrogen to dissolve in the blood and tissues. If the diver surfaces too quickly. Source:", "s": "", "l": "Knowledge"}, {"c": 6, "q": "A RT notices that a patient's PaO2 increases significantly during hyperbaric oxygen therapy. The patient is breathing 100% oxygen in a chamber where the ambient pressure has been increased above normal atmospheric pressure. Which principle BEST explains the increased amount of oxygen physically dissolved in the patient's plasma?", "o": ["Dalton’s law", "Henry’s law", "Boyle’s law", "Charles’s law"], "a": 1, "e": "Henry’s law states that the amount of gas that dissolves in a liquid is proportional to its partial pressure. During hyperbaric oxygen therapy: ↑ Ambient pressure → ↑ PO₂ → ↑ oxygen dissolved in plasma", "s": "", "l": "Knowledge"}, {"c": 6, "q": "A patient is receiving the same FiO₂ after being transported from sea level to a high-altitude location. At high altitude, atmospheric pressure is lower. What happens to the partial pressure of inspired oxygen?", "o": ["It becomes zero because atmospheric pressure is lower", "Stays the same because CiO2 has not changed", "Increases because FiO2 stays the same", "decreases because total atmospheric pressure decreases"], "a": 3, "e": "At high altitude, the percentage of oxygen is still about 21%, but because the total barometric pressure decreases, oxygen’s partial pressure also decreases. Review Page Austin", "s": "", "l": "Knowledge"}, {"c": 6, "q": "Which statement describes Boyle’s law?", "o": ["At constant temperature, gas volume varies inversely with pressure.", "At constant temperature, gas volume varies directly with pressure.", "At constant pressure, gas volume varies directly with absolute temperature.", "At constant volume, gas pressure varies directly with absolute temperature."], "a": 0, "e": "Boyle’s law (P1V1 = P2V2): at constant temperature, volume and pressure vary inversely. (Study-guide key listed B; corrected to A.)", "s": "", "l": "Knowledge"}, {"c": 6, "q": "Which statement describes Charles’s law?", "o": ["At constant temperature, gas volume varies inversely with pressure.", "At constant temperature, gas volume varies directly with pressure.", "At constant pressure, gas volume varies directly with absolute temperature.", "At constant volume, gas pressure varies directly with absolute temperature."], "a": 2, "e": "Charles’s law(V1/T1=V2/T2) states that if you hold pressure constant, only volume and temperature change.", "s": "", "l": "Knowledge"}, {"c": 6, "q": "Which statement describes Gay-Lussac’s law?", "o": ["At constant temperature, gas volume varies inversely with pressure.", "At constant temperature, gas volume varies directly with pressure.", "At constant pressure, gas volume varies directly with absolute temperature.", "At constant volume, gas pressure varies directly with absolute temperature."], "a": 3, "e": "Gay-Lussac’s law(P1/T1 = P2/T2) states that if you hold volume constant, Pressure and Temperature change.", "s": "", "l": "Knowledge"}, {"c": 6, "q": "In Charles’s law(V1/T1 = V2/T2), temperature must be written in which scale?", "o": ["Fahrenheit", "Celsius", "Kelvin", "None of the above"], "a": 2, "e": "Gas law ratios must be expressed in an absolute temperature scale that begins at zero. 3. Clinical Challenge/Understanding/Interpretation/TroubleShooting", "s": "", "l": "Knowledge"}, {"c": 6, "q": "A gas occupies 6.0 L at 1 atm. If it is compressed to 3 atm at constant temperature, what happens to its volume?", "o": ["Increases to 18 L", "Decreases to 2.0 L", "Remains 6.0 L", "Decreases to 3.0 L"], "a": 1, "e": "Boyle’s law says: 61 = 3x = 2.0 L", "s": "", "l": "Knowledge"}, {"c": 6, "q": "Why must an oxygen tank be made of steel?", "o": ["To make it lighter to carry.", "To hold oxygen as a liquid in the tank.", "To keep the volume constant while the very high pressures and temperatures of oxygen change inside the tank.", "None of the above."], "a": 2, "e": "According to Gay-Lussac’s law, holding volume constant allows for changing very high pressures and temperatures safely.", "s": "", "l": "Knowledge"}, {"c": 6, "q": "In which situation must the combined gas law be used rather than Boyle’s, Charles’s, or Gay-Lussac’s law alone?", "o": ["Only when temperature changes while pressure and volume are fixed.", "Pressure, volume, and temperature all change at the same time.", "Only when the amount of gas changes.", "None of the above."], "a": 1, "e": "When Pressure, Volume, and Temperature change at the same time.", "s": "", "l": "Knowledge"}, {"c": 6, "q": "After an oxygen tank is brought in from cold storage, its volume measurements are not correct. What should the RT do? What should the RT do?", "o": ["Go ahead and use it.", "Tag it as a leaky tank", "Allow the cylinder to warm to room temperature, then recheck the pressure before concluding there is a leak.", "Replace the oxygen tank."], "a": 2, "e": "Wait for the temperature to adjust the oxygen tank. Since Gay-Lussac’s law states that temperature affects pressure. End of Luis’s Questions. Chapter 39 Humidity and Bland Aerosol Group project Number 1-3 - Emily (Humidity Basics (2 Knowledge + 1 Application)) Number 3-6 - Sreypech (IBS & Artificial Airway (2 Knowledge +1 Application)) Number 7-9 - Maly (Principles of Humidifier Performance ( 2 Understanding + 1 Application)) Number 10-12 - Brittany (Bubble & Passover Humidifier (2 Understanding + 1 Application)) Number 13-15 - Marissa (Heated Humidification (1 Application +2 Clinical)) Number 16-18 - Ale (HME (1 Application + 2 Clinical)) Nu", "s": "Section 1, Foundations of Respiratory Care, Physical Principles of Respiratory Care, Pages 101- 102, Chapter 6. Eagan’s Fundamentals of Respiratory Ca", "l": "Troubleshooting"}, {"c": 39, "q": "What is the difference between absolute humidity (AH) and relative humidity (RH)?", "o": ["AH measures temperature, while RH measures water vapor pressure.", "AH measures the actual amount of water vapor in a given volume of gas, while RH expresses water vapor as a percentage of the amount required for full saturation.", "AH measures the percentage of water vapor, while RH measures the actual amount of water vapor in mg/L.", "AH and RH measure the same thing but use different units."], "a": 1, "e": "Absolute humidity measures the amount of water vapor in a given volume of gas and is expressed in mg/L. Relative humidity compares the amount of water vapor present with the amount required to fully saturate the gas at the same temperature and pressure. Correct answer: B", "s": "Egan’s Fundamentals of Respiratory Care, 13th ed., Chapter 39, p. 818", "l": "Knowledge"}, {"c": 39, "q": "Which conditions describe body temperature and pressure saturated (BTPS)?", "o": ["37°C and 100% relative humidity", "22°C and 50% relative humidity", "30°C and 95% relative humidity", "37°C and 50% relative humidity"], "a": 0, "e": "As inspired gas moves into the lungs, it reaches BTPS conditions at a body temperature of 37°C and becomes fully saturated with water vapor at 100% relative humidity. Figure 39.1 shows the absolute humidity at these conditions as 43.9 mg/L. Correct Answer: A", "s": "Egan’s Fundamentals of Respiratory Care, 13th ed., Chapter 39, pp. 818–819", "l": "Knowledge"}, {"c": 39, "q": "A patient is breathing room air with an absolute humidity of 10 mg/L. At BTPS, the absolute humidity is 43.9 mg/L. What is the patient’s humidity deficit?", "o": ["10 mg/L", "23.9 mg/L", "33.9 mg/L", "43.9 mg/L"], "a": 2, "e": "The humidity deficit is the amount of water vapor that must be added to inspired gas to reach BTPS conditions. Figure 39.1 shows that gas with an absolute humidity of 10 mg/L must reach 43.9 mg/L at BTPS. Therefore, 43.9 − 10 = 33.9 mg/L. Correct Answer: C", "s": "Egan’s Fundamentals of Respiratory Care, 13th ed., Chapter 39, Figure 39.1, pp. 818–819.", "l": "Knowledge"}, {"c": 39, "q": "Which statement best describes the isothermic saturation boundary (ISB)?", "o": ["The point where inspired gas reaches body temperature and 100% relative humidity", "The point where aerosol particles begin depositing the upper airway", "The point condensation begin forming in a ventilator circuit", "The point where oxygen and carbon dioxide diffuse across the alveolar capillary membrane"], "a": 0, "e": "ISB is the point where inspired gas reaches body temperature (37 C) and become fully saturated with water vapor at 100% RH", "s": "Egan’s Fundamentals of Respiratory Care, 13th ed., Chapter 39, pp. 809", "l": "Knowledge"}, {"c": 39, "q": "A patient is intubated with an endotracheal tube. How does bypassing the upper airway affect the patient’s need for humidification?", "o": ["It decreases the end for humidification because the lower airway produces enough moisture", "It increase the need for supplemental humidification because inspired gas no longer receives normal heat and moisture from the upper airway", "It eliminates the need for humification because the endotracheal tube warms inspired gas", "It increase humidification naturally by shifting the ISB toward the upper airway"], "a": 1, "e": "when an endotracheal tube bypasses the upper airway inspired gas not receive the normal warming and humidification provided by the nose and upper airway. This causes the ISB to shift farther down or distally into the respiratory tract. Therefore the patient need supplemental humidification to help provide adequate heat and moisture to protect the lower airway.", "s": "Egan’s Fundamentals of Respiratory Care, 13th ed., Chapter 39, pp. 809–810.", "l": "Knowledge"}, {"c": 39, "q": "Which of the following is a common effect of inadequate humidification of the respiratory tract?", "o": ["Thin, watery secretions", "Decreased airway resistance", "Thick, dehydrated secretion", "Increased mucociliary clearance"], "a": 2, "e": "inadequate humidification cause the respiratory tract to lose moisture. As a result secretion can become thick and dehydrated making them more difficult for patient to clear. This can contribute to problem such as increased airway resistance increase work of breathing and mucus plugging.", "s": "Egan’s Fundamentals of Respiratory Care, 13th ed., Chapter 39, pp. 810.", "l": "Knowledge"}, {"c": 39, "q": "Which physical principle of humidifier performance is the primary, most dominant factor governing the maximum water-vapor capacity and overall absolute humidity output of a medical gas humidifier?", "o": ["Surface area of the liquid-gas interface", "Temperature of the gas and water", "Contact time between gas bubbles and water", "Thermal mass of the water reservoir"], "a": 1, "e": "Warmer gas holds more water vapor and cooling saturated gas creates rain out. Temperature is the single most important factor determining how much water vapor a gas can hold. As temperature increases, the kinetic energy of water molecules increases, allowing more water to evaporate and exponentially raising its absolute humidity capacity (for example, gas at body temperature 37°C holds a maximum of 44 mg/L at saturation, whereas cold gas at 10°C holds only 9.4 mg/L).", "s": "(Course handout and Chp. 39 powerpoint)", "l": "Knowledge"}, {"c": 39, "q": "A wick-type passover humidifier uses a sheet of absorbent paper that draws water up from a reservoir. Which physical principle is being maximized by using this absorbent paper to increase moisture delivery to the patient?", "o": ["Surface area of contact between the gas and water", "Gas flow velocity through the chamber", "Pressure inside the water reservoir", "Chemical breakdown of water molecules into hydrogen and oxygen"], "a": 0, "e": "The absorbent paper acts like a sponge, spreading liquid water out over a wide surface. The larger the contact area where dry gas meets the wet surface, the more water molecules can evaporate into the gas stream at one time. Humidifiers do not rely on high pressure or chemical decomposition, and increasing velocity actually reduces contact time.", "s": "(Course handout)", "l": "Knowledge"}, {"c": 39, "q": "A respiratory therapist is monitoring an intubated patient receiving mechanical ventilation with an active passover wick humidifier. During rounds, the therapist observes that the delivered absolute humidity at the circuit wye has dropped from 37 mg/L down to 20 mg/L, despite the heater remaining powered on. Upon inspecting the device, the water feed bag is empty and the absorbent paper wick inside the chamber is mostly dry. Which combination of physical principles explains why a dry wick causes this sudden drop in humidity output?", "o": ["Loss of surface area for evaporation and loss of thermal mass needed to hold stable heat.", "Increased contact time between gas and dry paper causing friction heat.", "Increased capillary action causing liquid water to condense inside the circuit.", "Decrease in gas velocity leading to turbulent flow and back-pressure."], "a": 0, "e": "A wick humidifier draws water up an absorbent material via capillary action to create a massive surface area for gas-water interaction without generating liquid aerosol droplets. When the water bag runs dry, the wick dries out, drastically reducing the active surface area available for evaporation. Furthermore, depleting the water volume reduces the system's thermal mass (the liquid's ability to store heat energy), causing the minimal remaining moisture to cool rapidly during evaporation and driving down humidity output.", "s": "(course handout)", "l": "Knowledge"}, {"c": 39, "q": "A patient receiving oxygen by nasal cannula at 5 L/min reports nasal dryness and irritation. Which humidification device should the respiratory therapist select?", "o": ["Heated wick-type passover humidifier", "Unheated bubble humidifier", "Heat and moisture exchanger", "Ultrasonic nebulizer"], "a": 1, "e": "Unheated bubble humidifier An unheated bubble humidifier is appropriate for a patient receiving low-flow oxygen who is experiencing nasal dryness. It adds moisture to the gas and is mainly used to improve patient comfort with nasal cannula oxygen.", "s": "Chapter 39 Powerpoint and course workbook", "l": "Knowledge"}, {"c": 39, "q": "Which humidifier would be most appropriate for a mechanically ventilated patient who requires humidification at high gas flows?", "o": ["Unheated bubble humidifier", "Heated passover humidifier", "Heat and moisture exchange", "Cool-mist nebulizer"], "a": 1, "e": "Heated passover humidifier Heated passover humidifiers are designed to provide greater humidifiers with little resistance to gas flow. Wick-type passover can maintain high relative humidity at higher flows, making them appropriate for mechanical ventilation.", "s": "Chapter 39 Workbook", "l": "Knowledge"}, {"c": 39, "q": "A patient receiving oxygen through an unheated bubble humidifier is later intubated and placed on long-term mechanical ventilation. Which change in humification would be most appropriate?", "o": ["Continue using the bubble humidifier", "Switch to a heated passover humidifier", "Remove humidification completely", "Use an ultrasonic nebulizer continuously"], "a": 1, "e": "Switch to a heated passover humidifier An artificial airway bypasses the normal warming and humidifying function of the upper airway. A heated passover humidifier provides a greater amount of heat and moisture required for prolonged mechanical ventilation. Chapter 39 workbook Question 1:", "s": "", "l": "Knowledge"}, {"c": 39, "q": "According to clinical practice guidelines, what are the recommended temperature and humidity targets at the patient wye when conditioning inspired gas with a heated humidifier for an intubated patient?", "o": ["25°C to 28°C with a minimum absolute humidity of 15 mg/L", "33°C to 41°C with a minimum absolute humidity of 30 mg/L", "37°C to 45°C with a minimum relative humidity of 50%", "20°C to 22°C with a maximum water vapor content of 20 mg/L"], "a": 1, "e": "Current AARC Clinical Practice Guidelines recommend that heated humidifiers deliver gas at 33°C to 41°C at the patient wye, providing a minimum of 30 mg/L of water vapor to properly condition inspired gas and prevent humidity deficits or secretion encrustation in intubated patients. Delivering lower humidity levels (such as 15–20 mg/L) is insufficient for a bypassed upper airway and is typical of unheated bubble humidifiers, whereas heating gas beyond recommended limits increases the risk of thermal airway burns.", "s": "Egan’s Fundamentals of Respiratory Care", "l": "Clinical"}, {"c": 39, "q": "An intubated, mechanically ventilated patient with a bypassed upper airway presents with thick, dehydrated pulmonary secretions and is expected to require ventilator support for more than 5 days (>96 hours). Which humidification device is most appropriate for this patient?", "o": ["An unheated bubble humidifier", "A passive Heat-Moisture Exchanger (HME)", "A heated passover or wick humidifier", "An unheated large-volume jet nebulizer"], "a": 2, "e": "Heated active humidifiers (such as heated passover or wick systems) are specifically indicated for patients with bypassed upper airways requiring long-term mechanical ventilation (>96 hours) and for managing thick, dehydrated secretions.", "s": "Egan’s Fundamentals of Respiratory Care", "l": "Knowledge"}, {"c": 39, "q": "While inspecting the ventilator circuit of a patient receiving heated humidification, a respiratory therapist notices a significant accumulation of condensate (rainout) in the inspiratory limb that is beginning to occlude gas flow. Which action should the therapist take to safely resolve this issue?", "o": ["Drain the accumulated condensate back into the humidifier water reservoir to conserve sterile water.", "Increase the gas flow rate through the circuit to push the accumulated water into the patient's airway.", "Drain the condensate away from the patient into a designated collection container or water trap.", "Turn off the heating element completely and convert the patient to an unheated bubble humidifier."], "a": 2, "e": "Condensation in heated humidification circuits poses significant hazards, including gas flow occlusion, accidental aspiration, and bacterial cross-contamination/colonization. drained AWAY from the patient into inline water traps or designated drain receptacle.", "s": "Egan’s Fundamentals of Respiratory Care", "l": "Knowledge"}, {"c": 39, "q": "An RT is evaluating an HME placed on a newly intubated patient. Which finding confirms that the HME is functioning properly?", "o": ["The inspired gas temperature increases because the HME actively heats the air", "The HME returns heat and moisture captured from the patient’s previous exhalation", "The HME adds humidity by aerosolizing sterile water", "The HME mixes ambient air with inspired gas to maintain humidity"], "a": 1, "e": "Often called an 'artificial nose,' HMEs capture up to 70% of a patient's exhaled heat and moisture and return it on the next inspiration.", "s": "Powerpoint Ch.39", "l": "Knowledge"}, {"c": 39, "q": "A patient with sepsis is mechanically ventilated. Over the last hour, the RT notes minute ventilation increased from 9 → 14 L/min, secretions becoming thick, HME feels heavy and damp, peak pressures are rising. What is the most appropriate action?", "o": ["Increase inspiratory flow and keep the HME", "Replace the HME with heated humidification", "Suction the patient and continue using the same HME", "Increase PEEP to offset rising pressures"], "a": 1, "e": "The combination of high minute ventilation, thick secretions, a saturated HME, and rising peak pressures indicates passive humidification failure, so the correct action is to replace the HME with heated humidification.", "s": "Power point Ch 39. Slide 26,27,30", "l": "Knowledge"}, {"c": 39, "q": "A 1.2kg premature infant is mechanically ventilated in a heated incubator. The ventilator circuit includes a passive HME placed at the wye. Over the last 45 minutes, the RT observes: The ET tube has a noticeable leak, typical for neonates,Secretions are becoming thick and more difficult to suction, The HME appears dry, with little moisture return,The infant’s work of breathing has increased, and the SpO₂ has dropped from 95% → 89% What is the most appropriate action?", "o": ["Increase inspiratory flow to overcome rising resistance", "Replace the HME with active heated humidification", "Change the HME to a new one and continue monitoring", "Increase PEEP to compensate for the leak"], "a": 1, "e": "Neonates have tiny tidal volumes, so even a small HME adds significant dead space, increasing CO₂ retention and reducing effective ventilation.The ET tube leak also prevents exhaled gas from fully passing through the HME, making passive humidification unreliable.The infant’s thick secretions and rising peak pressures indicate dry gas and inadequate humidification.", "s": "Power point Ch. 39 Slide 22,25,27,28,30", "l": "Knowledge"}, {"c": 39, "q": "A respiratory therapist notes that an ultrasonic nebulizer (USN) is turned on, but there is no visible mist output. After verifying that the electrical power supply including the cord, plug, fuse, and circuit breakers are functioning perfectly, what should the clinician check next?", "o": ["Empty the chamber and fill it with freshly distilled water.", "Replace the unit entirely or send it for immediate repair.", "Inspect the couplant chamber water level and check for debris.", "Ensure that carrier gas is flowing and the amplitude control is set above the minimum."], "a": 3, "e": "The 1st step was accomplished by checking the power supply. The 2nd step is to confirm the carrier gas is flowing through the device and the amplitude and output control is set above the minimum. The 3rd step is to inspect the couplant chamber to confirm the proper level of water filling and no debris or dirt. And the 4th step is to make sure the couplant chamber solution meets the manufacturer’s specifications.", "s": "(Egan’s, Pg. 826)", "l": "Troubleshooting"}, {"c": 39, "q": "A respiratory therapist notices inadequate mist production while administering therapy to a patient using a pneumatically powered large-volume jet nebulizer. After confirming that the siphon tube is clear and the jet orifice is properly aligned, which of the following is the most appropriate next step?", "o": ["Check and increase the driving gas input flow.", "Fill the reservoir chamber with distilled water.", "Replace or send the nebulizer unit for repair.", "Disassemble the unit to check the internal fuse."], "a": 0, "e": "poor mist production can be caused by an insufficient input flow of driving gas, a siphon tube obstruction, or a jet orifice misalignment. Since the siphon tube is clear and the jet orifice is properly aligned, the large-volume jet nebulizer should be checked for inadequate driving gas flow.", "s": "(Egan’s, Pg. 826)", "l": "Knowledge"}, {"c": 39, "q": "A respiratory therapist is performing a diagnostic sputum test on a patient using Ultrasonic Nebulizer (USN) with 3% hypertonic saline. A few minutes into the procedure the patient starts to cough violently, wheezing audibly, and complains of severe chest pain. What should the RT do immediately?", "o": ["Switch the USN solution to sterile distilled water.", "Decrease the amplitude setting on the USN to reduce the output.", "Stop the treatment, administer oxygen, and initiate a fast-acting bronchodilator.", "Encourage the patient to take deeper breaths to mobilize secretion."], "a": 2, "e": "Patient coughing violently, wheezing audible and complaining of severe chest pain means the hypertonic saline is causing bronchospasm and leading to low oxygen delivery. The RT should administer oxygen and bronchodilator medication to open the airways, immediately after stopping the treatment.", "s": "(Egan’s, Pg. 827)", "l": "Troubleshooting"}, {"c": 39, "q": "A mechanically ventilated patient receiving heated humidification develops progressively thick, tenacious secretions. The humidifier is powered on and the ventilator circuit is intact, but the respiratory therapist notices that the humidifier chamber is nearly empty. What should the therapist do first?", "o": ["Increase the patient's tidal volume", "Suspect inadequate humidification and check/correct the humidifier's sterile-water supply", "Turn off the heated humidifier to prevent rain-out", "Replace the ventilator circuit immediately"], "a": 1, "e": "Power ON does not necessarily mean adequate humidification is being delivered. Correct answer: B A nearly empty humidifier chamber combined with increasingly tenacious secretions suggests inadequate humidification. The therapist should follow the troubleshooting process rather than replace equipment immediately. After assessing patient stability, check the circuit, water supply, settings, sensor position, and whether appropriate humidification is actually reaching the patient. Once you correct the problem, reassess the patient and secretions. Remember the connection: Inadequate water/humidification → airway moisture loss → thicker secretions ", "s": "", "l": "Troubleshooting"}, {"c": 39, "q": "A mechanically ventilated patient is receiving heated humidification. The respiratory therapist notices increasingly thick secretions even though the humidifier contains adequate water. During troubleshooting, the therapist discovers that an external heat source is warming the humidifier's temperature sensor. What is the most likely effect?", "o": ["The sensor reads falsely low, causing excessive heater output", "The sensor reads falsely high, causing the controller to decrease heater output and potentially deliver inadequately conditioned gas", "The sensor increases carrier gas flow and produces excessive aerosol", "The sensor causes the humidifier chamber to automatically drain"], "a": 1, "e": "A servo-controlled humidifier depends on an accurate temperature-sensor reading to regulate heater output. Correct Answer: B If an external heat source warms the sensor, the sensor will falsely read very high, causing the controller to think the gas is already warm enough. Heater output will start decreasing; actual gas delivery may be cooler, causing airway moisture to become inadequate and secretions to thicken. This is why sensor position and environmental influences on the sensor are part of the troubleshooting ladder. - Egan's Fundamentals of Respiratory Care, 13th ed., Chapter 39, - Class 2 Lecture, Slides 49–56: Servo Control - Guided ", "s": "", "l": "Troubleshooting"}, {"c": 39, "q": "A mechanically ventilated patient is receiving heated humidification. During transport, the respiratory therapist notices a large amount of condensate collecting in a dependent loop of the ventilator circuit near the patient's airway. The patient is currently stable. What should the respiratory therapist do?", "o": ["Drain the condensate toward the patient to clear the circuit", "Pour the condensate back into the humidifier reservoir", "Drain the condensate away from the patient into the appropriate collection point and reposition the circuit", "Replace the entire ventilator circuit immediately"], "a": 2, "e": "Condensation forms when warm, humidified gas cools in the ventilator circuit, decreasing the amount of water vapor the gas can hold. The excess water condenses into liquid. Correct Answer: C Direct condensate away from the patient's airway and toward the appropriate collection point. Repositioning the circuit helps eliminate dependent loops where water can accumulate. Do not return condensate to the humidifier reservoir because it may be contaminated with patient secretions and microorganisms. A stable patient does not automatically require complete circuit replacement simply because condensate is present. - Egan's Fundamentals of Respiratory", "s": "", "l": "Troubleshooting"}],NOTES={"4": [{"t": "b", "x": "Standard Precautions and Hand Hygiene: The basic infection-prevention +measures used for ALL patients in ALL healthcare settings regardless of known diagnosis. PPE is selected depending on anticipated exposure, not just the patient's diagnosis. Includes, hand hygiene, gloves, mask/face/eye protection, gown, equipment handling, sharps safety. Hand hygiene rules: use soap and water when hands are visibly soiled and or when spore/infectious-diarrhea risk makes mechanical removal necessary. Perform hand hygiene b
